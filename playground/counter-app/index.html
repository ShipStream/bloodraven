<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloodraven Counter App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1e293b; border-radius: 16px; padding: 48px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.4); min-width: 380px; }
  h1 { font-size: 1.25rem; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
  .counter { font-size: 5rem; font-weight: 700; color: #f8fafc; margin: 24px 0; font-variant-numeric: tabular-nums; }
  .btn { background: #3b82f6; color: white; border: none; padding: 16px 48px; font-size: 1.1rem; border-radius: 12px; cursor: pointer; transition: all 0.15s; font-weight: 600; }
  .btn:hover { background: #2563eb; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { background: #475569; cursor: not-allowed; transform: none; }
  .meta { margin-top: 24px; font-size: 0.8rem; color: #64748b; line-height: 1.8; }
  .meta span { color: #94a3b8; }
  .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status.ok { background: #22c55e; }
  .status.ro { background: #eab308; }
  .status.err { background: #ef4444; }
  .error-banner { background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.85rem; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="error-banner" id="error"></div>
  <h1>Bloodraven Click Counter</h1>
  <div class="counter" id="value">--</div>
  <button class="btn" id="incr" onclick="increment()">+ Increment</button>
  <div class="meta">
    <div><span class="status" id="statusDot"></span>DB Host: <span id="host">--</span></div>
    <div>Read-Only: <span id="ro">--</span></div>
    <div>Last Update: <span id="ts">--</span></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);

async function fetchCounter() {
  try {
    const r = await fetch('/api/counter');
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    render(d);
    $('error').style.display = 'none';
  } catch(e) {
    $('error').textContent = e.message;
    $('error').style.display = 'block';
    $('statusDot').className = 'status err';
  }
}

async function increment() {
  $('incr').disabled = true;
  try {
    const r = await fetch('/api/increment', { method: 'POST' });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    render(d);
    $('error').style.display = 'none';
  } catch(e) {
    $('error').textContent = e.message;
    $('error').style.display = 'block';
  } finally {
    $('incr').disabled = false;
  }
}

function render(d) {
  $('value').textContent = d.value;
  $('host').textContent = d.dbHost || 'unknown';
  $('ro').textContent = d.readOnly ? 'YES' : 'no';
  $('ts').textContent = d.updatedAt;
  $('statusDot').className = 'status ' + (d.readOnly ? 'ro' : 'ok');
  $('incr').disabled = d.readOnly;
}

fetchCounter();
setInterval(fetchCounter, 2000);
</script>
</body>
</html>
