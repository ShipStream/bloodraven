apiVersion: shipstream.io/v1alpha1
kind: MysqlFailoverGroup
metadata:
  name: playground
  namespace: bloodraven-playground
spec:
  image: mysql:9.7
  credentials:
    operatorSecretName: mysql-credentials
  pollInterval: 2s
  failureThreshold: 3
  recoveryThreshold: 2
  failoverCooldown: 30s # short for playground experimentation
  splitBrainPolicy:
    sitePriorities: [iad, pdx]
  dns:
    hostname: playground-db.example.local
    ttlSeconds: 10
  sites:
    - name: iad
      serverID: 101
      role: PrimaryCandidate
      zone: zone-iad
      taintNodeSelector:
        bloodraven.shipstream.io/failover-group.playground: "true"
        bloodraven.shipstream.io/site.playground: iad
      lbIP: "10.96.100.10"
      storage:
        storageClassName: playground-fast
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 1Gi
    - name: pdx
      serverID: 102
      role: PrimaryCandidate
      zone: zone-pdx
      taintNodeSelector:
        bloodraven.shipstream.io/failover-group.playground: "true"
        bloodraven.shipstream.io/site.playground: pdx
      lbIP: "10.96.100.20"
      storage:
        storageClassName: playground-fast
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 1Gi
    - name: reader
      serverID: 103
      role: ReadOnly
      zone: zone-reader
      mysqlConf:
        max-connections: "150"
      serviceTemplate:
        type: NodePort
        externalTrafficPolicy: Local
        nodePort: 30306
        annotations:
          playground.bloodraven.shipstream.io/purpose: site-local-reads
      storage:
        storageClassName: playground-fast
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 1Gi
  sidecar:
    leaseTimeout: 20s
    peerCheckInterval: 5s
  replication:
    maxLagSeconds: 30
    readOnlyMaxLagSeconds: 10
  # Playground-only Dragonfly co-management. Bloodraven creates one
  # Dragonfly StatefulSet per site and configures non-active sites as
  # replicas of the active site. Disable by removing this block or
  # setting enabled=false; the rest of the failover group is unaffected.
  dragonfly:
    enabled: true
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.0
    port: 6379
    adminPort: 9999
    maxMemory: 256Mi
    proactorThreads: 1
    plannedFailover:
      maxSyncWait: 30s
      onSyncTimeout: Proceed
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
