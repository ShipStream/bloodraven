apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-s3-credentials
  namespace: bloodraven-playground
type: Opaque
stringData:
  # AWS_* envs are what Dragonfly's S3 client reads.
  AWS_ACCESS_KEY_ID: rustfsadmin
  AWS_SECRET_ACCESS_KEY: rustfsadmin
  AWS_REGION: us-east-1
  # RUSTFS_* envs are what the rustfs server binary reads. Holding both
  # naming conventions in the same secret lets the rustfs Deployment
  # use a single `envFrom` instead of two `valueFrom.secretKeyRef`
  # entries — those secretKeyRef lookups have hit a kubelet
  # secret-cache race on k3s/k3d that leaves the pod in
  # CreateContainerConfigError indefinitely (the secret exists in the
  # API server but the pod-scoped kubelet cache returns not-found and
  # never invalidates).
  RUSTFS_ACCESS_KEY: rustfsadmin
  RUSTFS_SECRET_KEY: rustfsadmin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: bloodraven-playground
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: bloodraven-playground
  labels:
    app.kubernetes.io/name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          imagePullPolicy: IfNotPresent
          args:
            - /data
          env:
            - name: RUSTFS_ADDRESS
              value: :9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          # RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY (rustfs server) and
          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (downstream
          # Dragonfly S3 client) both live in this secret. envFrom is
          # deliberately preferred over per-env valueFrom.secretKeyRef
          # entries: the latter have been observed to stick in
          # CreateContainerConfigError on k3s/k3d when the pod is
          # scheduled before the kubelet's pod-scoped secret cache has
          # observed the secret, with no recovery on subsequent secret
          # writes. envFrom re-resolves the secret each time the
          # container starts.
          envFrom:
            - secretRef:
                name: dragonfly-s3-credentials
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: bloodraven-playground
  labels:
    app.kubernetes.io/name: rustfs
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
