# Example backup configuration for the playground failover group.
#
# Apply with:
#   kubectl patch mysqlfailovergroup playground -n bloodraven-playground \
#     --type merge --patch-file playground/manifests/backup-profile.yaml
#
# The S3 profile targets a MinIO sidecar expected at minio.bloodraven-playground:9000.
# The PVC profile provisions a local RWO volume.
#
# To trigger a one-off backup:
#   kubectl apply -f playground/manifests/mysqlbackup-adhoc.yaml
#
# NOTE: production deployments should always pin the mysqlsh image to a
# full major.minor tag (as below). Using a floating tag like `:9` or
# `:latest` is discouraged because mysqlsh dump/load compatibility across
# versions is not guaranteed. The image below bundles mysqlsh with the
# community-server 9.7 release.
apiVersion: shipstream.io/v1alpha1
kind: MysqlFailoverGroup
metadata:
  name: playground
  namespace: bloodraven-playground
spec:
  backup:
    image: container-registry.oracle.com/mysql/community-server:9.7
    maxLagSecondsForSource: 60
    activeDeadlineSeconds: 1800
    retry:
      maxAttempts: 3
      initialBackoffSeconds: 60
      maxBackoffSeconds: 900
    profiles:
      - name: minio
        retentionPolicy:
          count: 5
          maxAgeDays: 7
          minKeep: 1
          maxFailedKeep: 10
        storage:
          type: S3
          s3:
            bucket: bloodraven
            prefix: playground
            endpointURL: http://minio.bloodraven-playground:9000
            credentialsSecret: minio-backup-creds
        dump:
          threads: 2
          bytesPerChunk: "64M"
          compression: zstd
          consistent: true
        # Scheduled verification. The operator renders a CronJob that
        # fires `bloodraven trigger-verification` on this schedule,
        # which creates a MysqlBackupVerification CR against the
        # latest Succeeded MysqlBackup for this profile. The manual
        # path is `./playground/verify-backup.sh run minio`.
        verification:
          enabled: true
          schedule: "*/30 * * * *"
          timeZone: "Etc/UTC"
          concurrencyPolicy: Forbid
          retentionPolicy:
            keepSuccessful: 5
            keepFailures: 5
          sanityCheck:
            query: "SELECT COUNT(*) FROM information_schema.tables"
            expect:
              minRows: 1
              maxDurationSeconds: 30
      - name: local-pvc
        retention: 3
        storage:
          type: PVC
          pvc:
            storageClassName: playground-fast
            size: 2Gi
        dump:
          threads: 2
          compression: zstd
    schedules:
      - name: every-10min
        profileName: minio
        schedule: "*/10 * * * *"
        timeZone: "Etc/UTC"
        concurrencyPolicy: Forbid
