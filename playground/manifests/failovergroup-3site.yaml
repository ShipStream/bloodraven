# Three-site playground variant: two PrimaryCandidate sites (iad, pdx)
# plus a cross-region DisasterRecovery follower (fra). Useful for exercising the
# "only PrimaryCandidate can be promoted" and "sitePriorities picks the
# split-brain winner" behaviours without touching the default 2-site
# manifest.
#
# Apply instead of (not alongside) failovergroup.yaml.
apiVersion: shipstream.io/v1alpha1
kind: MysqlFailoverGroup
metadata:
  name: playground
  namespace: bloodraven-playground
spec:
  image: mysql:9.7
  credentials:
    operatorSecretName: mysql-credentials
  pollInterval: 2s
  failureThreshold: 3
  recoveryThreshold: 2
  failoverCooldown: 30s
  dns:
    hostname: playground-db.example.local
    ttlSeconds: 10
  splitBrainPolicy:
    sitePriorities: [iad, pdx]
  sites:
    - name: iad
      serverID: 101
      role: PrimaryCandidate
      zone: zone-iad
      taintNodeSelector:
        bloodraven.shipstream.io/failover-group.playground: "true"
        bloodraven.shipstream.io/site.playground: iad
      loadBalancerIP: "10.96.100.10"
      storage:
        storageClassName: playground-fast
        size: 1Gi
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 500m, memory: 512Mi }
    - name: pdx
      serverID: 102
      role: PrimaryCandidate
      zone: zone-pdx
      taintNodeSelector:
        bloodraven.shipstream.io/failover-group.playground: "true"
        bloodraven.shipstream.io/site.playground: pdx
      loadBalancerIP: "10.96.100.20"
      storage:
        storageClassName: playground-fast
        size: 1Gi
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 500m, memory: 512Mi }
    - name: fra
      serverID: 103
      role: DisasterRecovery
      zone: zone-fra
      taintNodeSelector:
        bloodraven.shipstream.io/failover-group.playground: "true"
        bloodraven.shipstream.io/site.playground: fra
      loadBalancerIP: "10.96.100.30"
      storage:
        storageClassName: playground-fast
        size: 1Gi
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 500m, memory: 512Mi }
  sidecar:
    leaseTimeout: 20s
    peerCheckInterval: 5s
  replication:
    maxLagSeconds: 30
