# Most local clusters (k3d, minikube, kind) provide a default StorageClass.
# This creates a playground-specific alias that works across common setups.
# If your cluster uses a different provisioner, edit the provisioner field.
#
# Common provisioners:
#   k3d/k3s:  rancher.io/local-path
#   minikube: k8s.io/minikube-hostpath
#   kind:     rancher.io/local-path
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: playground-fast
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
