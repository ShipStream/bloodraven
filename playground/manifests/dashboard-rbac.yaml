# RBAC for the dashboard to read DNSEndpoint CRs from the K8s API.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: bloodraven-playground
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-playground
rules:
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-playground
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-playground
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: bloodraven-playground
