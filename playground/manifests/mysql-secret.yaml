apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: bloodraven-playground
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "playground-root-pw"
  # Allow root to connect via TCP (not just Unix socket)
  MYSQL_ROOT_HOST: "%"
  MYSQL_REPLICATION_USER: "replicator"
  MYSQL_REPLICATION_PASSWORD: "repl-pw-playground"
  # DSN used by the sidecar (connects to localhost MySQL in the same pod)
  # and as a template by the operator (which replaces the host per-site).
  dsn: "root:playground-root-pw@tcp(127.0.0.1:3306)/mysql"
