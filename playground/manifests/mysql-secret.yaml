apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: bloodraven-playground
type: Opaque
stringData:
  # The operator account (spec.credentials.operatorSecretName). The playground
  # runs it as root so its tooling can keep using the root password; the
  # first-boot init script creates root@'%' with these credentials, which is
  # what the operator and the sidecar connect as.
  username: "root"
  password: "playground-root-pw"
  MYSQL_ROOT_PASSWORD: "playground-root-pw"
  MYSQL_REPLICATION_USER: "replicator"
  MYSQL_REPLICATION_PASSWORD: "repl-pw-playground"
