version: "2"
run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck # Includes gosimple in v2.
    - unused
  settings:
    staticcheck:
      # Preserve v1 staticcheck + gosimple without adding style/quick-fix checks.
      checks: ["SA*", "S*"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Ignore unchecked HTTP response writes; the connection may already be broken.
      - linters:
          - errcheck
        path: internal/sidecar/server\.go
      - linters:
          - errcheck
        path: cmd/bloodraven/main\.go
      # Ignore unchecked writes and unused helpers in tests.
      - linters:
          - errcheck
        path: .*_test\.go
      - linters:
          - unused
        path: .*_test\.go
      # Deprecations are tracked separately.
      - linters:
          - staticcheck
        text: 'SA1019:'
      # Empty branch in replication.go's fallback comment block.
      - linters:
          - staticcheck
        path: internal/mysql/replication\.go
        text: 'SA9003:'
    paths:
      - third_party$
      - builtin$
      - examples$
