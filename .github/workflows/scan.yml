name: Trivy Security Scan

on:
  pull_request:
    branches: [main]
    # Main has no required status checks (verified 2026-10-28); if scans become
    # required, use job-level filtering to avoid leaving required checks pending.
    # Keep this a strict subset of .dockerignore trees; scan *.md and .github/**.
    paths-ignore:
      - 'site/**'
      - 'course/**'
      - 'proposals/**'
      - 'skills/**'
      - '.agents/**'
  # Catch new CVEs and mutable base-image updates even without image changes.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Cancel superseded PR runs; give each non-PR run its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan / ${{ matrix.target }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bloodraven
            image: bloodraven
            platform: linux/amd64
            arch: amd64
          - target: bloodraven
            image: bloodraven
            platform: linux/arm64
            arch: arm64
          - target: sidecar
            image: bloodraven-sidecar
            platform: linux/amd64
            arch: amd64
          - target: sidecar
            image: bloodraven-sidecar
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target ${{ matrix.target }} \
            --tag ${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }} \
            --load \
            .

      - name: Run Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          format: sarif
          output: trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scan (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF to GitHub Security tab
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.image }}-${{ matrix.arch }}
