# Reusable E2E workflow — creates a kind cluster, deploys the playground,
# and runs playground-chaos with the selected profile.
#
# Called by:
#   .github/workflows/e2e.yml (nightly, manual, PR label)
#   .github/workflows/release.yml (release gate)
# Images can come from .github/workflows/_e2e-images.yml or a local build.
name: E2E (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: "Chaos profile (smoke|release|full)"
        required: false
        default: "release"
        type: string
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        default: 90
        type: number
      scenario:
        description: >-
          Optional comma-separated scenario IDs; bypasses profile selection.
          Scenarios run in order against the same cluster, so put destructive
          ones last.
        required: false
        default: ""
        type: string
      label:
        description: >-
          Optional short label for artifact names. A long scenario list
          exceeds the 256-character artifact-name limit, so callers that
          pass several scenarios set this.
        required: false
        type: string
        default: ""
      shard:
        description: >-
          Run only this part (1..shards) of the profile, on this job's own
          cluster; 0 runs the whole profile. The caller starts one job per
          part (a matrix). Ignored with `scenario`.
        required: false
        default: 0
        type: number
      shards:
        description: "Number of parts the profile is split into when `shard` is set"
        required: false
        default: 1
        type: number
      enable-encryption:
        description: "Convert the default playground to TLS + encryption before running"
        required: false
        default: false
        type: boolean
      images-artifact:
        description: "Same-run artifact holding e2e-images.tar from _e2e-images.yml; empty builds images locally"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  BLOODRAVEN_SETUP_HELM_INSTALL_CRDS: "1"
  SKIP_IMAGE_BUILD: "1"

concurrency:
  # The shard is part of the group: the shards of one profile run side by
  # side and must not cancel each other.
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scenario != '' && inputs.scenario || inputs.profile }}-${{ inputs.shard }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Real-cluster E2E (${{ inputs.scenario != '' && inputs.scenario || inputs.profile }}${{ inputs.scenario == '' && inputs.shard != 0 && format(' {0}/{1}', inputs.shard, inputs.shards) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # What this job runs, for artifact and report names: the caller's
      # label, else the scenario list, else the profile, with the shard
      # appended so the shards of one profile upload distinct artifacts.
      E2E_LABEL: ${{ inputs.label != '' && inputs.label || (inputs.scenario != '' && inputs.scenario || (inputs.shard != 0 && format('{0}-shard-{1}-of-{2}', inputs.profile, inputs.shard, inputs.shards) || inputs.profile)) }}
      E2E_JUNIT_OUT: playground/chaos-results/e2e-${{ inputs.scenario != '' && 'scenarios' || (inputs.shard != 0 && format('{0}-shard-{1}-of-{2}', inputs.profile, inputs.shard, inputs.shards) || inputs.profile) }}-junit.xml
      E2E_SHARD: ${{ inputs.scenario == '' && inputs.shard != 0 && format('{0}/{1}', inputs.shard, inputs.shards) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build playground-chaos
        run: make build-playground-chaos

      - name: Download prebuilt E2E images
        id: dl
        if: inputs.images-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.images-artifact }}
          path: ${{ runner.temp }}/e2e-images
      - name: Load prebuilt E2E images
        id: load
        if: steps.dl.outcome == 'success'
        continue-on-error: true
        run: docker load -i "$RUNNER_TEMP/e2e-images/e2e-images.tar"
      - name: Build Docker images
        # Rebuild if no artifact was requested, or downloading/loading it failed.
        if: steps.load.outcome != 'success'
        env:
          REQUESTED: ${{ inputs.images-artifact }}
        run: |
          [ -z "$REQUESTED" ] || echo "::warning::prebuilt images artifact '$REQUESTED' unavailable; building locally"
          make e2e-images

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          # kind, node image and kubectl are pinned explicitly: the action's
          # defaults move with every release, which silently changed the
          # cluster's Kubernetes version under the e2e suite (kind-action
          # 1.15.0 jumped v1.35 -> v1.37). Raise these deliberately, as a
          # tested change.
          version: v0.31.0
          node_image: kindest/node:v1.35.0
          kubectl_version: v1.35.0
          cluster_name: bloodraven-e2e
          config: .github/kind/e2e-calico.yaml
          # CNI is disabled in this kind config, so nodes cannot become
          # Ready until Calico is installed in the next step.
          wait: 0s

      - name: Install Calico CNI
        # The manifest is checksum-pinned so a moved tag cannot change what
        # gets applied. Recompute the sha256 when bumping the version.
        run: |
          curl -fsSL -o /tmp/calico.yaml https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
          echo "93e7f39c3f93f9dc67ee2386aa7240d8d13ff62e54535a2f5f6432e8c6c0f24f  /tmp/calico.yaml" | sha256sum -c -
          kubectl apply -f /tmp/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=180s
          kubectl wait nodes --all --for=condition=Ready --timeout=180s

      - name: Load images into kind
        run: |
          kind load docker-image bloodraven:playground bloodraven-sidecar:playground bloodraven-counter:playground bloodraven-dashboard:playground bloodraven-dns-webhook:playground --name bloodraven-e2e

      - name: Deploy playground
        env:
          # Encryption adoption must start from a TLS-consistent group.
          # A live TLS conversion would introduce a second ordered
          # rollout and make the encryption scenario nondeterministic.
          BLOODRAVEN_SETUP_TLS: ${{ inputs.enable-encryption && '1' || '0' }}
        run: |
          set -o pipefail
          ./playground/setup.sh 2>&1 | tee playground/setup.log
        timeout-minutes: 10

      - name: Enable encryption on existing group
        if: inputs.enable-encryption
        env:
          BLOODRAVEN_PLAYGROUND_MYSQL_UNCONFINED: '1'
        run: |
          set -o pipefail
          ./playground/enable-encryption.sh 2>&1 | tee playground/enable-encryption.log
        timeout-minutes: 30

      - name: Run E2E (${{ inputs.profile }} profile)
        if: inputs.scenario == ''
        env:
          E2E_PROFILE: ${{ inputs.profile }}
        run: |
          # A shard runs its part of the profile (run-all --shard=<i>/<n>);
          # the other parts run in sibling jobs, each on its own cluster.
          # The planned IDs feed the summary step (which scenarios never ran).
          ./bin/playground-chaos list --profile="$E2E_PROFILE" --shard="$E2E_SHARD" | grep -E '^[0-9]' | cut -d' ' -f1 > "$RUNNER_TEMP/e2e-planned.txt"
          make test-e2e E2E_PROFILE="$E2E_PROFILE" E2E_JUNIT_OUT="$E2E_JUNIT_OUT" E2E_SHARD="$E2E_SHARD"
        timeout-minutes: ${{ inputs.timeout-minutes }}

      - name: Run E2E scenarios ${{ inputs.scenario }}
        if: inputs.scenario != ''
        env:
          E2E_SCENARIOS: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          printf '%s\n' "$E2E_SCENARIOS" > "$RUNNER_TEMP/e2e-planned.txt"
          # Sequential on purpose: these share one cluster and the list is
          # ordered least- to most-destructive. A failure stops the run so
          # forensics are captured against the state that produced it.
          # run-all (not one `chaos-run` per ID) so a listed scenario that
          # sets ResetBeforeRunAll gets its reset, as in a profile run.
          #
          # setup.sh returns before the operator's first reconcile settles,
          # so run-all first waits for a healthy baseline (--baseline-wait,
          # default 5m) instead of failing the first scenario's instant
          # precheck on a still-converging cluster. A timeout is not fatal:
          # the precheck decides and captures forensics.
          ./bin/playground-chaos run-all --scenarios="$E2E_SCENARIOS" --junit-out="$E2E_JUNIT_OUT"
        timeout-minutes: ${{ inputs.timeout-minutes }}

      - name: Summarize results
        # Per-scenario pass / fail / not run, from the JUnit report that
        # run-all rewrites after every scenario: a job that is killed at its
        # timeout still shows what finished and what never ran.
        if: always()
        run: python3 .github/scripts/e2e-summary.py "E2E $E2E_LABEL" "$E2E_JUNIT_OUT" "$RUNNER_TEMP/e2e-planned.txt" >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.E2E_LABEL }}-junit
          path: ${{ env.E2E_JUNIT_OUT }}
          retention-days: 30
          overwrite: true

      - name: Upload chaos forensics
        # Also when the job is cancelled at its timeout: the captures of the
        # scenarios that failed before it are what #236 could not triage.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.E2E_LABEL }}-forensics
          path: playground/chaos-results/
          retention-days: 30

      - name: Upload kind logs
        if: failure()
        run: |
          mkdir -p /tmp/kind-logs
          kind export logs --name=bloodraven-e2e /tmp/kind-logs || true
        continue-on-error: true

      - name: Upload kind logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.E2E_LABEL }}-kind-logs
          path: /tmp/kind-logs/
          retention-days: 14
        continue-on-error: true

      - name: Upload setup logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.E2E_LABEL }}-setup-logs
          path: |
            playground/setup.log
            playground/enable-encryption.log
          retention-days: 14
