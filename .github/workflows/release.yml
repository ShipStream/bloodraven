name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: draft-release
    strategy:
      matrix:
        include:
          - target: bloodraven
            image: ghcr.io/shipstream/bloodraven
          - target: sidecar
            image: ghcr.io/shipstream/bloodraven-sidecar
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images with cosign (keyless OIDC)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

  helm:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create gh-pages branch if missing
        run: |
          git fetch origin gh-pages || true
          if ! git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initialize gh-pages"
            git push origin gh-pages
            git checkout -
          fi

      - name: Update Chart version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/bloodraven/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/bloodraven/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package charts/bloodraven -d .cr-release-packages

      - name: Publish Helm chart to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-worktree origin/gh-pages
          mkdir -p gh-pages-worktree/charts
          cp .cr-release-packages/*.tgz gh-pages-worktree/charts/
          helm repo index gh-pages-worktree --url https://raw.githubusercontent.com/${{ github.repository }}/gh-pages
          cd gh-pages-worktree
          git add .
          git commit -m "Publish chart bloodraven-${GITHUB_REF_NAME#v}"
          git push origin HEAD:gh-pages
          cd ..
          git worktree remove gh-pages-worktree

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [docker, helm]
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
