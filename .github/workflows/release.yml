name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  OPERATOR_IMAGE_REPOSITORY: ghcr.io/shipstream/bloodraven
  SIDECAR_IMAGE_REPOSITORY: ghcr.io/shipstream/bloodraven-sidecar
  # The chart repo is served straight off the gh-pages branch via
  # raw.githubusercontent.com, NOT GitHub Pages: the org's Pages custom
  # domain (docs.shipstream.io) is owned by the Mintlify dev center, so
  # https://shipstream.github.io/bloodraven redirects there and 404s. This
  # base matches what `helm repo index --url` stamps into index.yaml below
  # (github.repository), so `helm repo add` and the chart download links agree.
  HELM_REPOSITORY_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages
  HELM_OCI_REPOSITORY: oci://ghcr.io/shipstream/bloodraven/helm

jobs:
  # ci-gate mirrors the core checks from .github/workflows/ci.yml so a
  # tag push is subject to the same bar as a main-branch merge. Without
  # this, `git tag v0.2.0 <dirty-SHA>` would happily ship signed images
  # and a signed Helm chart from a SHA whose CI run failed (AUDIT H3).
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...
      - name: Build bloodraven
        run: go build ./cmd/bloodraven
      - name: Build sidecar
        run: go build ./cmd/sidecar
      - name: Run unit tests
        run: make test-unit
      - name: Run component tests
        run: make test-component
      - name: Run code generation
        run: make generate && make manifests
      - name: Check for uncommitted generated changes
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'make generate && make manifests' and commit the changes."
            git diff
            exit 1
          fi
      - name: Check chart CRD drift (AUDIT L5)
        run: |
          if ! diff -r config/crd/bases/ charts/bloodraven/crds/; then
            echo "charts/bloodraven/crds/ is out of sync with config/crd/bases/."
            echo "Copy regenerated files: cp config/crd/bases/*.yaml charts/bloodraven/crds/ && commit."
            exit 1
          fi
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build docs
        working-directory: docs
        run: npm run build
      - name: Verify llms-full coverage
        working-directory: docs
        run: npm run verify:llms

  # E2E release gate — runs the *smoke* real-cluster E2E (core failover:
  # clean primary kill, planned switchover, operator restart) before any
  # publishing jobs. This blocks a tag from shipping if the critical
  # failover path is broken, while staying fast (~5m) and resistant to a
  # single broad-scenario flake stalling every release. The full
  # release-profile suite runs as a post-publish stage (e2e-full below)
  # and nightly (.github/workflows/e2e.yml).
  e2e-gate:
    name: E2E gate (smoke profile)
    needs: ci-gate
    uses: ./.github/workflows/_e2e.yml
    with:
      profile: smoke


  e2e-encryption-gate:
    name: E2E gate (encryption adoption and rotation)
    needs: ci-gate
    uses: ./.github/workflows/_e2e.yml
    with:
      # Ordered least- to most-destructive: 48 and 50 leave the cluster
      # healthy, 51 rebuilds the replica datadir. Together they are the
      # minimum set from .tmp/chaos-plan-v1.0.md that makes "encryption
      # validated in CI" true rather than rotation-only.
      scenario: 48-keyring-seal-and-rotation,50-encrypted-pod-replace,51-encrypted-reclone
      enable-encryption: true
      # Three scenarios on one cluster; 51 alone budgets 20m for the clone.
      timeout-minutes: 150
  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [ci-gate, e2e-gate, e2e-encryption-gate]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release body
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-body.md <<EOF
          Release ${GITHUB_REF_NAME}

          Operator image: \`${OPERATOR_IMAGE_REPOSITORY}:${VERSION}\`
          Sidecar image: \`${SIDECAR_IMAGE_REPOSITORY}:${VERSION}\`

          Helm chart:
          - Helm repo: \`${HELM_REPOSITORY_URL}\`
          - OCI: \`${HELM_OCI_REPOSITORY}\`

          Install from the Helm repo:
          \`\`\`bash
          helm repo add bloodraven ${HELM_REPOSITORY_URL}
          helm repo update
          helm install bloodraven bloodraven/bloodraven --version ${VERSION}
          \`\`\`

          Install from OCI:
          \`\`\`bash
          helm install bloodraven ${HELM_OCI_REPOSITORY}/bloodraven --version ${VERSION}
          \`\`\`
          EOF
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-body.md
          generate_release_notes: true

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [ci-gate, e2e-gate, draft-release]
    strategy:
      matrix:
        include:
          - target: bloodraven
            image: ghcr.io/shipstream/bloodraven
          - target: sidecar
            image: ghcr.io/shipstream/bloodraven-sidecar
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images with cosign (keyless OIDC)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

  helm:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Log in to GitHub Container Registry for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Create gh-pages branch if missing
        run: |
          git fetch origin gh-pages || true
          if ! git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initialize gh-pages"
            git push origin gh-pages
            git checkout -
          fi

      - name: Update Chart version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/bloodraven/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/bloodraven/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package charts/bloodraven -d .cr-release-packages

      - name: Publish Helm chart to GHCR OCI
        run: |
          helm push ".cr-release-packages/bloodraven-${GITHUB_REF_NAME#v}.tgz" "${HELM_OCI_REPOSITORY}"

      - name: Publish Helm chart to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-worktree origin/gh-pages
          mkdir -p gh-pages-worktree/charts
          cp .cr-release-packages/*.tgz gh-pages-worktree/charts/
          helm repo index gh-pages-worktree --url https://raw.githubusercontent.com/${{ github.repository }}/gh-pages
          cd gh-pages-worktree
          git add .
          git commit -m "Publish chart bloodraven-${GITHUB_REF_NAME#v}"
          git push origin HEAD:gh-pages
          cd ..
          git worktree remove gh-pages-worktree

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [docker, helm]
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false

  # Post-release full E2E — runs the complete release-profile suite (real
  # MySQL pods/PVCs/DNS/taints, emergency + planned failover, self-fencing,
  # network partition, PVC loss/re-bootstrap, old-primary recovery, state
  # durability, backup/PITR) AFTER the release is forged. By design this
  # cannot block publishing (the artifacts are already out); a failure here
  # is an alert to investigate or yank the release, not a gate. This gives
  # every forged release the full validation the smoke gate trades away for
  # speed, without one broad-scenario flake stalling the publish.
  e2e-full:
    name: Post-release E2E (release profile)
    needs: publish-release
    uses: ./.github/workflows/_e2e.yml
    with:
      profile: release
