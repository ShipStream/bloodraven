name: CLA

# Requires contributors to sign CLA.md before their code can be merged.
# Signatures are stored as JSON on the `cla-signatures` branch of this repo.
#
# Setup, one time:
#   1. Create a repo secret named CLA_SIGNATURES_TOKEN containing a fine-grained
#      PAT with Contents: read/write on ShipStream/bloodraven. The action needs a
#      PAT rather than GITHUB_TOKEN to commit signatures from a
#      pull_request_target run.
#   2. Create the empty `cla-signatures` branch:
#        git switch --orphan cla-signatures && git commit --allow-empty -m "CLA signatures" && git push -u origin cla-signatures
#
# Until the secret exists this workflow will fail on outside PRs. It is safe to
# leave disabled until the repo starts accepting outside contributions.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    # Only run on PR comments, not issue comments.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/ShipStream/bloodraven/blob/main/CLA.md
          branch: cla-signatures
          # Maintainers and bots do not need to sign.
          allowlist: colinmollenhour,dependabot[bot],renovate[bot],*[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, please read
            and sign the [Contributor License Agreement](https://github.com/ShipStream/bloodraven/blob/main/CLA.md).
            It is a license grant, not a copyright assignment — you keep the
            copyright in your contribution. Signing covers all your future
            contributions to this repository.

            To sign, post a comment on this pull request with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signed by all contributors. Thank you.
