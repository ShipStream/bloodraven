name: CLA

# Requires contributors to sign CLA.md before their code can be merged.
# Signatures are stored as JSON on the `cla-signatures` branch of this repo.
#
# Setup, one time:
#   1. DONE - the orphan `cla-signatures` branch exists.
#   2. Create a repo secret named CLA_SIGNATURES_TOKEN containing a PAT with
#      Contents: read/write on ShipStream/bloodraven. contributor-assistant
#      lists PERSONAL_ACCESS_TOKEN as required and cannot fall back to
#      GITHUB_TOKEN: with it empty, its authenticated lookup of the signature
#      branch fails as "Branch cla-signatures not found" even though the branch
#      is there and the repo is public.
#
# Until that secret exists the enforcement step is skipped rather than failed,
# so the check does not red-X every PR while the repo has no outside
# contributors. Adding the secret activates enforcement with no further edits.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    # The `secrets` context is not available to `if:` conditions (only `github`,
    # `env`, `needs`, `vars`, ... are). Referencing it there is a workflow-file
    # syntax error that fails the run before any job starts, so mirror the
    # secret into a job-level env var and branch on that instead.
    env:
      CLA_SIGNATURES_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
    # Only run on PR comments, not issue comments.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: Report that CLA enforcement is not configured
        if: ${{ env.CLA_SIGNATURES_TOKEN == '' }}
        run: |
          {
            echo "### CLA check skipped"
            echo
            echo "\`CLA_SIGNATURES_TOKEN\` is not set, so CLA enforcement is inactive."
            echo "Add the secret to activate it; see the header of \`.github/workflows/cla.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CLA Assistant
        if: ${{ env.CLA_SIGNATURES_TOKEN != '' }}
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/ShipStream/bloodraven/blob/main/CLA.md
          branch: cla-signatures
          # Maintainers and bots do not need to sign.
          allowlist: colinmollenhour,dependabot[bot],renovate[bot],*[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, please read
            and sign the [Contributor License Agreement](https://github.com/ShipStream/bloodraven/blob/main/CLA.md).
            It is a license grant, not a copyright assignment — you keep the
            copyright in your contribution. Signing covers all your future
            contributions to this repository.

            To sign, post a comment on this pull request with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signed by all contributors. Thank you.
