name: Deploy Site

# Publishes the bloodraven.dev Docus site under `site/` to Railway.
#
# Setup:
#   1. Create a Railway *project* token (Railway -> project -> Settings ->
#      Tokens). A project token is scoped to one project and environment, so
#      the CLI needs no interactive login and no `railway link` step.
#   2. Store it as the repo secret `RAILWAY_TOKEN`.
#   3. If the Railway service is not named `bloodraven-site`, set a repo
#      variable `RAILWAY_SERVICE` to the real name.
#
# Railway builds the uploaded directory with Nixpacks per `site/railway.json`;
# `site/.railwayignore` keeps build artifacts out of the upload.
#
# Which commit is deployed: until v1.7.0 ships, bloodraven.dev follows the
# latest published release, NOT `main`. `main` is about to carry incompatible
# v1alpha1 -> v1beta1 CRD changes (issue #237, proposals/20-api-v1beta1.md
# section 6, F-41/F-42), and the site must never document fields that no
# installable release has. So there is no push-to-main trigger: every run
# resolves the latest non-prerelease GitHub Release and builds `site/` from
# that tag.
#
#   * release.yml calls this workflow after it publishes a release. (A
#     release published with GITHUB_TOKEN does not fire `release` events, so
#     the `release: published` trigger only covers releases published by
#     hand, for example a draft published from the UI.)
#   * To ship a docs fix for the released version, commit it to a branch cut
#     from the release tag (e.g. `release-1.6` from `v1.6.0`) and run this
#     workflow by hand with `ref` set to that branch:
#       gh workflow run deploy-site.yml -f ref=release-1.6
#     Then land the same fix on `main`. The next release redeploys from its
#     own tag and supersedes the hotfix.
#   * A bare manual run (no `ref`) redeploys the latest release.
#
# After v1.7.0 ships, revisit whether to go back to deploying `main`.

on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag or SHA to build instead of the latest release (docs
          hotfix from a release branch). Leave empty for the latest release.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize deploys so two runs cannot race the same service. Superseded
# runs are dropped while pending rather than cancelled mid-upload, so the
# last requested deploy is always the one that ends up live.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    # Prereleases never become the site.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: bloodraven.dev
      url: https://bloodraven.dev
    # RAILWAY_TOKEN is set only on the steps that need it, so the CLI's npm
    # postinstall script (which downloads the binary) never sees it.
    env:
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'bloodraven-site' }}
    steps:
      - name: Resolve the ref to deploy
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          if [ -n "$REF_INPUT" ]; then
            echo "Deploying the requested ref: $REF_INPUT"
            echo "ref=$REF_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `gh release view` with no tag returns the release marked Latest,
          # which excludes drafts and prereleases.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          # release.yml publishes every v*.*.* tag as a full release, so an
          # -rc tag could still be marked Latest. Refuse to publish it.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest release tag '$tag' is not a plain vX.Y.Z release. Run this workflow by hand with an explicit ref."
            exit 1
          fi
          echo "Deploying the latest release: $tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require RAILWAY_TOKEN
        # Without a token the CLI treats this as a cold first run and would
        # offer to create a brand new project. Fail loudly instead.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add a Railway project token as a repository secret; see the header of .github/workflows/deploy-site.yml."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.0

      - name: Deploy site/ to Railway
        working-directory: site
        # --ci streams build logs and exits when the build finishes, instead of
        # tailing the deploy log forever. --service is explicit so the CLI never
        # falls back to creating a new project/service. No `-y`: an unattended
        # run should fail rather than silently provision new infrastructure.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "$RAILWAY_SERVICE"

      - name: Summarize
        if: success()
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
        run: |
          {
            echo "### Site deployed"
            echo
            echo "Service \`$RAILWAY_SERVICE\` updated from \`$DEPLOY_REF\` (\`$(git rev-parse --short HEAD)\`)."
            echo
            echo "<https://bloodraven.dev>"
          } >> "$GITHUB_STEP_SUMMARY"
