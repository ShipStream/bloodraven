# E2E trigger workflow — nightly, manual, and PR-label-gated.
# The reusable workflow is in .github/workflows/_e2e.yml.
name: E2E

on:
  # Nightly release-profile run
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily

  # Manual dispatch with profile selection
  workflow_dispatch:
    inputs:
      profile:
        description: "Chaos profile (smoke|release|full)"
        required: false
        default: "release"
        type: choice
        options:
          - smoke
          - release
          - full

  # PR label gate: run smoke while the "e2e" label is present.
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# Cancel eligible PR runs as a unit; unrelated labels get a unique run group.
# This group differs from _e2e.yml's inner group to avoid caller/callee deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e') && (github.event.action != 'labeled' || github.event.label.name == 'e2e') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e') && (github.event.action != 'labeled' || github.event.label.name == 'e2e') }}

jobs:
  # Consumers inherit this trigger condition through needs.
  images:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    uses: ./.github/workflows/_e2e-images.yml

  # The smoke and release profiles run as one job. The full profile (manual
  # dispatch only) runs as FULL_PROFILE_SHARDS jobs, each on its own kind
  # cluster with its part of the profile (`run-all --shard=<i>/<n>`): one
  # job could not finish it inside its timeout, so the scenarios that are
  # only in the full profile never ran (#236). The runner splits the
  # profile, balanced by scenario Timeout; `playground-chaos list
  # --profile=full --shard=<i>/<n>` prints a part. A failed shard fails the
  # run and the others still finish (fail-fast is off).
  #
  # The shard list, `shards` and the 300-minute timeout are pinned by
  # TestFullProfileShardsFitCIJob (internal/playground/runner): every
  # shard's scenario Timeouts and resets must fit the timeout with room for
  # the cluster setup. Change the three together.
  e2e:
    needs: images
    name: e2e${{ matrix.shard != 0 && format(' (shard {0})', matrix.shard) || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.inputs.profile == 'full' && '[1, 2, 3, 4]' || '[0]') }}
    uses: ./.github/workflows/_e2e.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'smoke' || (github.event.inputs.profile || 'release') }}
      shard: ${{ matrix.shard }}
      shards: 4
      # The release profile includes the #206 cross-site PITR scenarios
      # (37, 68, 70), which budget 60-75m each. So does each full-profile
      # shard: one of 37, 68, 69 and 70 lands in each.
      timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 300 }}
      images-artifact: e2e-images

  # Label gating is intentionally PR-only: schedule and manual runs always
  # exercise encryption, while release publication uses release.yml's gate.
  encryption:
    needs: images
    uses: ./.github/workflows/_e2e.yml
    with:
      label: encryption
      # Ordered least- to most-destructive: 48 and 50 leave the cluster
      # healthy, 52 holds the primary down mid-rotation, 51 rebuilds the
      # replica datadir. Together they are the minimum set from
      # .tmp/chaos-plan-v1.0.md plus the #160 regression.
      scenario: 48-keyring-seal-and-rotation,50-encrypted-pod-replace,72-pitr-encrypted-binlog,52-rotation-promotion-refused,51-encrypted-reclone
      enable-encryption: true
      # Five scenarios on one cluster; 51 and 52 each budget 20m, 72 24m.
      timeout-minutes: 180
      images-artifact: e2e-images

  # Cross-site PITR (#206) and the encryption binding of the PITR archive
  # (#203). Same trigger as encryption: schedule, dispatch, and PRs
  # labelled e2e, so a label-gated PR run exercises every PITR scenario;
  # smoke stays unchanged. 31, 37, 68 and 70 are also in the release
  # profile; 69 is not (it would push the release run past its ceiling).
  pitr:
    needs: images
    uses: ./.github/workflows/_e2e.yml
    with:
      label: pitr
      # 31 first (single-site baseline); 37 and 68 are planned failbacks
      # (68 with reclones); 70 loses data on purpose and restarts the
      # archive; 69 last (key snapshots, refused key and encryption
      # changes, status-loss recovery, release). run-all stops at the first
      # failure, so 69, the newest and longest, runs after the #206
      # scenarios: a red 69 never hides them.
      scenario: 31-pitr-verification-rustfs,37-pitr-planned-failback-no-reclone,68-pitr-failback-with-reclone,70-pitr-lossy-failover,69-pitr-encryption-binding-refusal
      # Scenario Timeouts: 24m + 60m + 75m + 75m + 60m = 294m, plus the
      # reset run-all does before each of 37, 68, 70 and 69
      # (ResetBeforeRunAll, ~5m each) and setup, under the 360m hard cap of
      # a GitHub-hosted runner job. Each scenario also has a CleanupTimeout
      # (32-44m for these five, ~180m together) that is a worst-case
      # allowance for a hung cleanup, not a planned spend: Timeouts plus
      # cleanup allowances exceed the cap by design, and
      # TestPITRScenariosInPITRE2EJob guards only the Timeouts. Measured on
      # #206, 31/37/68/70 passed in 3/6/6/11 minutes, so a run that passes
      # them leaves 69 its whole budget plus its cleanup even if it times
      # out. This is the cap, not a target: the next PITR scenario goes
      # into a second job rather than into this list.
      timeout-minutes: 360
      images-artifact: e2e-images

  # Durable planned-failover claim (#235). The PR job above runs only the
  # smoke profile, so the planned-failover scenarios get their own targeted
  # job, label-gated through `images` like encryption. The default playground
  # already enables Dragonfly (22, 25, 26) and the deploy API (53, 64).
  planned-failover:
    needs: images
    uses: ./.github/workflows/_e2e.yml
    with:
      label: planned-failover
      # Ordered least- to most-destructive: switchovers and rollbacks first,
      # the operator restarts next, then 64 (holds the primary down), 23 (an
      # emergency failover plus restart) and 53 (lease expiry) last.
      scenario: 02-planned-switchover,35-planned-switchover-lag-timeout-rollback,22-planned-dragonfly-switchover,26-planned-dragonfly-sync-timeout-proceed,25-operator-restart-mid-dragonfly-failover,63-planned-failover-operator-restart-mid-lag,64-emergency-failover-during-planned-admission,23-failover-state-durability,53-deployment-hold-expiry
      timeout-minutes: 120
      images-artifact: e2e-images
