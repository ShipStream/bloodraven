# E2E trigger workflow — nightly, manual, and PR-label-gated.
# The reusable workflow is in .github/workflows/_e2e.yml.
name: E2E

on:
  # Nightly release-profile run
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily

  # Manual dispatch with profile selection
  workflow_dispatch:
    inputs:
      profile:
        description: "Chaos profile (smoke|release|full)"
        required: false
        default: "release"
        type: choice
        options:
          - smoke
          - release
          - full

  # PR label gate: run smoke while the "e2e" label is present.
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# Cancel eligible PR runs as a unit; unrelated labels get a unique run group.
# This group differs from _e2e.yml's inner group to avoid caller/callee deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e') && (github.event.action != 'labeled' || github.event.label.name == 'e2e') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e') && (github.event.action != 'labeled' || github.event.label.name == 'e2e') }}

jobs:
  # Consumers inherit this trigger condition through needs.
  images:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    uses: ./.github/workflows/_e2e-images.yml

  e2e:
    needs: images
    uses: ./.github/workflows/_e2e.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'smoke' || (github.event.inputs.profile || 'release') }}
      images-artifact: e2e-images

  # Label gating is intentionally PR-only: schedule and manual runs always
  # exercise encryption, while release publication uses release.yml's gate.
  encryption:
    needs: images
    uses: ./.github/workflows/_e2e.yml
    with:
      # Ordered least- to most-destructive: 48 and 50 leave the cluster
      # healthy, 52 holds the primary down mid-rotation, 51 rebuilds the
      # replica datadir. Together they are the minimum set from
      # .tmp/chaos-plan-v1.0.md plus the #160 regression.
      scenario: 48-keyring-seal-and-rotation,50-encrypted-pod-replace,52-rotation-promotion-refused,51-encrypted-reclone
      enable-encryption: true
      # Four scenarios on one cluster; 51 and 52 each budget 20m.
      timeout-minutes: 180
      images-artifact: e2e-images
