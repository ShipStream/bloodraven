name: Docs Publishing

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

env:
  PUBLIC_DOCS_BASE_URL: https://bloodraven.readthedocs.io/en/latest/

jobs:
  publish-readthedocs:
    name: Publish ReadTheDocs
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build docs
        working-directory: docs
        run: npm run build
      - name: Verify llms-full coverage
        working-directory: docs
        run: npm run verify:llms
      - name: Trigger ReadTheDocs build
        working-directory: docs
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          READTHEDOCS_PROJECT_SLUG: ${{ vars.READTHEDOCS_PROJECT_SLUG || 'bloodraven' }}
          READTHEDOCS_VERSION_SLUG: ${{ vars.READTHEDOCS_VERSION_SLUG || 'latest' }}
        run: npm run publish:readthedocs

  public-link-check:
    name: Public Docs Link Check
    runs-on: ubuntu-latest
    needs: [publish-readthedocs]
    if: ${{ always() && (github.event_name == 'schedule' || needs.publish-readthedocs.result == 'success') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Check public docs links
        working-directory: docs
        run: npm run check:public-links
