# Share one same-run image artifact across all E2E consumers.
name: E2E images (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build E2E images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build E2E images
        run: make e2e-images
      - name: Save E2E images
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-images"
          docker save bloodraven:playground bloodraven-sidecar:playground bloodraven-counter:playground \
            bloodraven-dashboard:playground bloodraven-dns-webhook:playground -o "$RUNNER_TEMP/e2e-images/e2e-images.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images/e2e-images.tar
          retention-days: 7
          overwrite: true
