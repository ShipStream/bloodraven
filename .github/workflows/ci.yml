name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build bloodraven
        run: go build ./cmd/bloodraven
      - name: Build sidecar
        run: go build ./cmd/sidecar

  test-unit:
    name: Test / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run unit tests
        run: make test-unit

  test-component:
    name: Test / Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run component tests
        run: make test-component

  test-envtest:
    name: Test / Envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Run envtest tests
        run: |
          KUBEBUILDER_ASSETS=$(setup-envtest use --bin-dir /tmp/envtest-bin -p path)
          export KUBEBUILDER_ASSETS
          make test-envtest

  generate-check:
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run code generation
        run: make generate && make manifests
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'make generate && make manifests' and commit the changes."
            git diff
            exit 1
          fi
      - name: Check chart CRD drift
        # CLAUDE.md requires charts/bloodraven/crds/ to mirror
        # config/crd/bases/. The two paths are edited separately so drift
        # happens without tooling. This catches it at PR time rather than
        # during a broken install (AUDIT L5).
        run: |
          if ! diff -r config/crd/bases/ charts/bloodraven/crds/; then
            echo "charts/bloodraven/crds/ is out of sync with config/crd/bases/."
            echo "Copy regenerated files: cp config/crd/bases/*.yaml charts/bloodraven/crds/ && commit."
            exit 1
          fi

  docs-build:
    name: Docs / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Verify llms-full coverage
        working-directory: site
        run: npm run verify:llms

  course-check:
    name: Course / Build and Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # The course site builder needs Node 20.19+ / 22.13+ / 24+.
          node-version: 22
          # No npm cache: course/package-lock.json is intentionally untracked
          # (removed in bd776fd), and setup-node hard-fails when
          # cache-dependency-path resolves to nothing. course-build falls back
          # to `npm install` when the lockfile is absent.
      - name: Run course content gates and runtime tests
        run: make course-verify
      - name: Check site/public/courses drift
        # site/public/courses is generated output committed to the repo, the
        # same arrangement as charts/bloodraven/crds. Rebuild and fail if the
        # committed copy no longer matches the course source.
        run: make course-check

  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [lint, build, test-unit, test-component, test-envtest, generate-check, docs-build, course-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          if echo "$results" | grep -q '"result": "failure"' || echo "$results" | grep -q '"result": "cancelled"'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."
