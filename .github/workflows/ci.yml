name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; main pushes and release calls get unique run groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.classify.outputs.go }}
      site: ${{ steps.classify.outputs.site }}
      course: ${{ steps.classify.outputs.course }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Self-test classifier
        run: .github/scripts/classify-changes_test.sh
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          all() { printf 'go=true\nsite=true\ncourse=true\n' | tee -a "$GITHUB_OUTPUT"; }
          # Release calls inherit the caller's push event; every non-PR runs all jobs.
          if [ "$EVENT_NAME" != pull_request ]; then echo "non-PR event: full run"; all; exit 0; fi
          # HEAD^1 is the PR merge commit's base; include old paths when files move.
          if ! paths="$(git diff --no-renames --name-only HEAD^1 HEAD)"; then
            echo "::warning::git diff failed; running every job"; all; exit 0
          fi
          printf '%s\n' "$paths"
          printf '%s\n' "$paths" | .github/scripts/classify-changes.sh | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          flavor: lint
          extra-paths: ~/.cache/golangci-lint
      - id: lint-key
        run: echo "key=golangci-lint-${{ runner.os }}-${{ runner.arch }}-$(go env GOVERSION)-$(make -s --no-print-directory golangci-lint-version)" >> "$GITHUB_OUTPUT"
      - id: lint-bin
        uses: actions/cache/restore@v6
        with:
          path: bin/golangci-lint
          key: ${{ steps.lint-key.outputs.key }}
      - name: Install golangci-lint
        if: steps.lint-bin.outputs.cache-hit != 'true'
        run: make install-lint
      - name: Print golangci-lint version
        run: ./bin/golangci-lint version
      - name: Run golangci-lint
        run: make lint
      - name: Save golangci-lint (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lint-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: bin/golangci-lint
          key: ${{ steps.lint-key.outputs.key }}
      - name: Save Go build cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.gocache.outputs.gocache }}
            ~/.cache/golangci-lint
          key: ${{ steps.gocache.outputs.build-key }}

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          flavor: plain
      - name: Build bloodraven
        run: go build ./cmd/bloodraven
      - name: Build sidecar
        run: go build ./cmd/sidecar
      - name: Save Go build cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gocache }}
          key: ${{ steps.gocache.outputs.build-key }}
      - name: Download Go modules for cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.mod-hit != 'true'
        run: go mod download
      - name: Save Go module cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.mod-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gomodcache }}
          key: ${{ steps.gocache.outputs.mod-key }}

  test-unit:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Test / Unit
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          flavor: race
      - name: Run unit tests
        run: make test-unit
      - name: Save Go build cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gocache }}
          key: ${{ steps.gocache.outputs.build-key }}

  test-component:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Test / Component
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          flavor: race
      - name: Run component tests
        run: make test-component

  test-envtest:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Test / Envtest
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          flavor: race
      - name: Install setup-envtest
        # Keep in step with sigs.k8s.io/controller-runtime and k8s.io/api in go.mod.
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
      - name: Run envtest tests
        run: |
          KUBEBUILDER_ASSETS=$(setup-envtest use 1.37.x --bin-dir /tmp/envtest-bin -p path)
          export KUBEBUILDER_ASSETS
          make test-envtest

  generate-check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          flavor: codegen
      - name: Run code generation
        run: make generate && make manifests
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'make generate && make manifests' and commit the changes."
            git diff
            exit 1
          fi
      - name: Check chart CRD drift
        # CLAUDE.md requires charts/bloodraven/crds/ to mirror
        # config/crd/bases/. The two paths are edited separately so drift
        # happens without tooling. This catches it at PR time rather than
        # during a broken install (AUDIT L5).
        run: |
          if ! diff -r config/crd/bases/ charts/bloodraven/crds/; then
            echo "charts/bloodraven/crds/ is out of sync with config/crd/bases/."
            echo "Copy regenerated files: cp config/crd/bases/*.yaml charts/bloodraven/crds/ && commit."
            exit 1
          fi
      - name: Save Go build cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gocache }}
          key: ${{ steps.gocache.outputs.build-key }}

  license-roundtrip:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.site == 'true'
    name: License / Roundtrip
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          flavor: race
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require node on PATH
        # The roundtrip test skips itself when node is missing.
        run: node --version
      - name: Cross-language license roundtrip
        run: make test-license-roundtrip

  docs-build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    name: Docs / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Run Node license tests
        working-directory: site
        run: npm test
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Verify llms-full coverage
        working-directory: site
        run: npm run verify:llms

  course-check:
    needs: changes
    if: needs.changes.outputs.course == 'true'
    name: Course / Build and Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: the built course site is committed and gated
          # on an exact-match drift check, so the toolchain that produces it
          # has to be reproducible.
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          # bun drives install and the build (see the `course-build` target),
          # but the Astro-based builder targets Node, so keep a supported Node
          # on PATH for anything that shells out to it.
          node-version: 22
      - name: Build the course site and sync it into site/public/courses
        # Keep build failures separate from drift failures for artifact uploads.
        run: make course
      - name: Run course content gates and runtime tests
        # Verify after sync so test writes to dist/ cannot affect the drift check.
        run: make course-verify-only
      - name: Check site/public/courses drift
        # site/public/courses is generated output committed to the repo, the
        # same arrangement as charts/bloodraven/crds. Fail if the committed
        # copy no longer matches what the rebuild produced.
        id: drift
        run: make course-drift
      - name: Upload rebuilt course site on drift
        # The drift check names the files that differ but not how. The built
        # CSS is one long minified line, so a text diff in the log is useless;
        # grab the artifact and diff it against the committed tree instead.
        #
        # Gated on the drift step specifically: bare `failure()` also fires
        # when an earlier step failed, which would upload a tree that was
        # never rebuilt.
        if: failure() && steps.drift.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: course-rebuilt
          path: site/public/courses/
          retention-days: 7

  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [changes, lint, build, test-unit, test-component, test-envtest, generate-check, license-roundtrip, docs-build, course-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          if echo "$results" | grep -q '"result": "failure"' || echo "$results" | grep -q '"result": "cancelled"'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."
