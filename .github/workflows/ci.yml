name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build bloodraven
        run: go build ./cmd/bloodraven
      - name: Build sidecar
        run: go build ./cmd/sidecar

  test-unit:
    name: Test / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test-unit

  test-component:
    name: Test / Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run component tests
        run: make test-component

  test-envtest:
    name: Test / Envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Run envtest tests
        run: |
          KUBEBUILDER_ASSETS=$(setup-envtest use --bin-dir /tmp/envtest-bin -p path)
          export KUBEBUILDER_ASSETS
          make test-envtest

  generate-check:
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run code generation
        run: make generate && make manifests
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'make generate && make manifests' and commit the changes."
            git diff
            exit 1
          fi

  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [lint, build, test-unit, test-component, test-envtest, generate-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          if echo "$results" | grep -q '"result": "failure"' || echo "$results" | grep -q '"result": "cancelled"'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."