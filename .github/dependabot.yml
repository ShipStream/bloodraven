version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: quarterly
    groups:
      go-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: quarterly
