---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: mysqlbackupverifications.shipstream.io
spec:
  group: shipstream.io
  names:
    kind: MysqlBackupVerification
    listKind: MysqlBackupVerificationList
    plural: mysqlbackupverifications
    singular: mysqlbackupverification
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.failoverGroupRef.name
      name: Group
      type: string
    - jsonPath: .spec.profileName
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.backupRef.name
      name: Backup
      priority: 1
      type: string
    - jsonPath: .status.startTime
      name: Started
      type: date
    - jsonPath: .status.completionTime
      name: Completed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MysqlBackupVerification is the Schema for the mysqlbackupverifications API.
          A verification restores a MysqlBackup artifact into an ephemeral,
          throwaway MySQL instance to prove the backup can actually be loaded.
          Unverified backups are schrödinger backups — the CR + its
          bloodraven_backup_verified_timestamp_seconds gauge give operators a
          concrete signal that recent backups are restorable.

          The ephemeral mysqld runs inside the verification Job's Pod on an
          emptyDir datadir, with a derived credentials Secret for the restore
          script. No Service or PersistentVolumeClaim is created; the Pod binds
          127.0.0.1 only and is not reachable from outside its own network
          namespace. On success all artifacts are cleaned up; on failure
          KeepOnFailure (default true) leaves the Job and its Pod in place for
          inspection until the retention sweep reclaims them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MysqlBackupVerificationSpec defines the desired state of
              a verification run.
            properties:
              backupRef:
                description: |-
                  BackupRef optionally pins the verification to a specific
                  MysqlBackup in the same namespace. When omitted, the reconciler
                  resolves the latest Succeeded MysqlBackup for (group, profile).
                properties:
                  name:
                    description: Name of the MysqlBackup.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              failoverGroupRef:
                description: |-
                  FailoverGroupRef identifies the MysqlFailoverGroup in the same
                  namespace whose backup profile should drive this verification.
                properties:
                  name:
                    description: Name of the MysqlFailoverGroup.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              keepOnFailure:
                default: true
                description: |-
                  KeepOnFailure leaves the verification Job and its Pod in place when the
                  verification terminates in Failed, so operators can kubectl exec
                  into the verification instance to inspect why the load failed.
                  On success all artifacts are always cleaned up regardless of
                  this field.

                  Defaults to true. Retention GC still reclaims KeepOnFailure
                  artifacts once the CR ages out of the failed-run retention bucket.
                type: boolean
              pointInTime:
                description: |-
                  PointInTime configures whether the verification replays archived
                  binlogs on top of the restored dump. Leave it unset to skip replay.
                  mode=Latest replays to the unique archive head; mode=Timestamp
                  restores the history of the first archived
                  transaction at or after a caller-supplied instant, cut just before
                  it. Either way the replay may span every site's archive. Requires
                  spec.backup.pitr.enabled=true on the referenced failover group.
                properties:
                  archiveProfileName:
                    description: |-
                      ArchiveProfileName names the backup profile whose PITR archive the
                      replay reads. Defaults to the group's spec.backup.pitr.profileName.
                      Use it to verify history in a retained archive after a prefix switch.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  excludeGtids:
                    description: |-
                      ExcludeGtids are never replayed and must not intersect the backup,
                      with the same meaning as PointInTimeSpec.ExcludeGtids: every archived
                      transaction committed between the backup's newest transaction and the
                      target (or the archive head in Latest mode) that is outside the
                      target history must be listed.
                    maxLength: 131072
                    type: string
                  mode:
                    description: 'Mode selects the replay end point: Latest or Timestamp.'
                    enum:
                    - Timestamp
                    - Latest
                    type: string
                  timestamp:
                    description: |-
                      Timestamp is the target instant, a whole second in the same forms as
                      PointInTimeSpec.StopDatetime (fractional seconds are refused; a
                      stored fractional value must be corrected in the same update, as for
                      StopDatetime). Replay restores the history of the first archived
                      transaction committed at or after it, cut just before that
                      transaction. Required when Mode=Timestamp; ignored otherwise.
                    maxLength: 40
                    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])?$
                    type: string
                required:
                - mode
                type: object
              profileName:
                description: |-
                  ProfileName is the name of a spec.backup.profiles[] entry on the
                  referenced failover group.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              resources:
                description: |-
                  Resources sets requests and limits for the verification MySQL
                  container. Forwarded to the Job pod verbatim; when unset, no
                  verification-specific resource requests or limits are
                  configured (the container inherits cluster / namespace default
                  limits if any). The datadir is an emptyDir on the node's disk, so
                  bound it with limits.ephemeral-storage.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              sanityCheck:
                description: |-
                  SanityCheck runs a single scalar-returning SELECT against the
                  ephemeral mysqld after the dump load (and optional PITR replay)
                  succeeds. Failures (errors, timeouts, or minRows mismatch) flip
                  the verification to Failed with a SanityCheckFailed /
                  SanityCheckTimeout reason so an otherwise-loadable but obviously
                  corrupt dump does not quietly pass the freshness gauge.
                properties:
                  expect:
                    description: |-
                      Expect configures the pass/fail thresholds applied to the query
                      result. When nil, a non-error return with any scalar result
                      passes.
                    properties:
                      maxDurationSeconds:
                        default: 60
                        description: |-
                          MaxDurationSeconds is the client-side timeout for the sanity
                          query. Exceeding it fails the verification with
                          reason=SanityCheckTimeout. Default: 60.
                        format: int32
                        minimum: 1
                        type: integer
                      minRows:
                        description: |-
                          MinRows is the floor applied to the scalar result. When >0 and
                          the scalar result is less than MinRows, the verification fails
                          with reason=SanityCheckFailed. Default: 0 (disabled).
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  query:
                    description: |-
                      Query is a single SQL statement. Must return a scalar
                      (single-row, single-column) result. Multi-statement inputs are
                      rejected to keep the timeout budget predictable.
                    minLength: 1
                    type: string
                required:
                - query
                type: object
              ttlSecondsAfterFinished:
                default: 0
                description: |-
                  TTLSecondsAfterFinished controls how long the verification Job and
                  its Pod persist after a successful verification before the
                  reconciler cleans them up. Default: 0 (clean up immediately).
                  Failed verifications with KeepOnFailure=true ignore this value.
                format: int32
                minimum: 0
                type: integer
            required:
            - failoverGroupRef
            - profileName
            type: object
          status:
            description: MysqlBackupVerificationStatus tracks observed state of a
              verification.
            properties:
              backupRef:
                description: |-
                  BackupRef is the resolved reference to the MysqlBackup that was
                  verified. Populated once the reconciler resolves spec.backupRef
                  (or the latest-Succeeded default).
                properties:
                  location:
                    description: Location copied from MysqlBackup.status.location.
                    type: string
                  name:
                    description: Name of the verified MysqlBackup.
                    type: string
                  storageType:
                    description: StorageType copied from MysqlBackup.status.storageType.
                    enum:
                    - S3
                    - PVC
                    type: string
                  uid:
                    description: UID of the verified MysqlBackup at resolution time.
                    type: string
                required:
                - name
                type: object
              completionTime:
                description: CompletionTime is when the verification reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations of this
                  verification's state. Types include "Verified" and
                  "ResourcesCleanedUp".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              durationSeconds:
                description: |-
                  DurationSeconds is the wall-clock duration from StartTime to
                  CompletionTime, computed on terminal transition.
                format: int64
                type: integer
              jobName:
                description: |-
                  JobName is the name of the restore Job that loaded the dump into
                  the ephemeral MySQL instance.
                type: string
              message:
                description: Message is a human-readable status message.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status was
                  computed against.
                format: int64
                type: integer
              phase:
                description: Phase is the lifecycle phase of this verification run.
                enum:
                - Pending
                - Provisioning
                - Restoring
                - Succeeded
                - Failed
                type: string
              pointInTime:
                description: |-
                  PointInTime is the certified outcome of the point-in-time replay,
                  read from the replay's verdict. Set on Succeeded verifications whose
                  spec.pointInTime.mode is not none.
                properties:
                  archive:
                    description: Archive identifies the archive the replay read.
                    properties:
                      algorithm:
                        description: Algorithm is the encryption algorithm; empty
                          for None.
                        enum:
                        - AES-256-GCM
                        type: string
                      archiveID:
                        description: |-
                          ArchiveID is the descriptor's archive ID, derived from the source
                          group's UID and the normalized destination.
                        pattern: ^ar1-[a-z2-7]{26}$
                        type: string
                      destination:
                        description: |-
                          Destination is the normalized archive destination the descriptor
                          was read from (s3://… or pvc://…).
                        maxLength: 4096
                        type: string
                      encryptionMode:
                        description: EncryptionMode is the archive's encryption mode.
                        enum:
                        - None
                        - Passphrase
                        type: string
                      source:
                        description: Source is the group that created the archive.
                        properties:
                          name:
                            description: Name is the source group's name.
                            maxLength: 253
                            type: string
                          namespace:
                            description: Namespace is the source group's namespace.
                            maxLength: 63
                            type: string
                          uid:
                            description: UID is the source group's metadata.uid.
                            type: string
                        required:
                        - name
                        - namespace
                        - uid
                        type: object
                    required:
                    - archiveID
                    - encryptionMode
                    - source
                    type: object
                  excludedDivergentTransactionCount:
                    description: |-
                      ExcludedDivergentTransactionCount is |D|: transactions committed between the backup's newest transaction and
                      the target, outside the target history, excluded by excludeGtids.
                    format: int64
                    type: integer
                  gtidExecuted:
                    description: |-
                      GtidExecuted is the target's @@global.gtid_executed after replay,
                      which the replay proved equal to the target history minus
                      excludeGtids. Empty when longer than 2048 characters; see
                      GtidExecutedSHA256.
                    maxLength: 2048
                    type: string
                  gtidExecutedSHA256:
                    description: |-
                      GtidExecutedSHA256 is the hex SHA-256 of GtidExecuted as the server
                      printed it (newlines removed).
                    pattern: ^([0-9a-f]{64})?$
                    type: string
                  lastReplayedBinlog:
                    description: LastReplayedBinlog is the file of the last segment.
                    properties:
                      name:
                        description: Name is the binlog file name, for example mysql-bin.000042.
                        maxLength: 255
                        type: string
                      site:
                        description: Site is the site whose archive holds the file.
                        maxLength: 63
                        pattern: ^[a-z0-9-]+$
                        type: string
                    required:
                    - name
                    - site
                    type: object
                  mode:
                    description: Mode is the replay mode.
                    enum:
                    - Timestamp
                    - Latest
                    type: string
                  newestReplayedCommitTime:
                    description: |-
                      NewestReplayedCommitTime is the newest original commit time among
                      the replayed transactions.
                    format: date-time
                    type: string
                  onHistoryExclusionCount:
                    description: OnHistoryExclusionCount is the number of GTIDs in
                      OnHistoryExclusions.
                    format: int64
                    type: integer
                  onHistoryExclusions:
                    description: |-
                      OnHistoryExclusions are excluded transactions on the target history that precede a replayed one (D-48).
                      Their GTIDs were skipped, but later row images may carry their effects; the result is not certified for them.
                      Empty when the set is too long to record; OnHistoryExclusionCount still counts it.
                    maxLength: 2048
                    type: string
                  outcome:
                    description: Outcome is how the end point was reached.
                    enum:
                    - TargetCovered
                    - Partial
                    - ArchiveHead
                    type: string
                  replaySites:
                    description: |-
                      ReplaySites are the sites whose archived binlogs were staged, sorted;
                      see ReplaySitesOmitted for the ones the verdict left out.
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9-]+$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  replaySitesOmitted:
                    description: |-
                      ReplaySitesOmitted counts further staged sites the verdict did not
                      name: its site list is bounded, so ReplaySites is complete only when
                      this is zero.
                    format: int32
                    minimum: 0
                    type: integer
                  replayedBinlogCount:
                    description: |-
                      ReplayedBinlogCount is the number of distinct archived binlogs the
                      segments read.
                    format: int32
                    type: integer
                  replayedTransactionCount:
                    description: |-
                      ReplayedTransactionCount is the number of transactions replayed on
                      top of the backup.
                    format: int64
                    type: integer
                  segmentCount:
                    description: SegmentCount is the number of replay segments.
                    format: int32
                    type: integer
                  stopTime:
                    description: |-
                      StopTime is the requested target (a whole second; commit times are
                      compared against it to the microsecond). Unset in Latest mode.
                    format: date-time
                    type: string
                required:
                - mode
                - outcome
                type: object
              replayedThroughBinlog:
                description: |-
                  ReplayedThroughBinlog is populated on Succeeded verifications
                  whose spec.pointInTime.mode was not "none". Captures the last
                  binlog event that was applied so operators can correlate the
                  verified coverage window against their RPO target.
                properties:
                  file:
                    description: |-
                      File is the last binlog file the replay applied, e.g.
                      "mysql-bin.000412".
                    type: string
                  position:
                    description: Position is not reported by current releases and
                      stays unset.
                    format: int64
                    type: integer
                  timestamp:
                    description: |-
                      Timestamp is the newest original commit time among the replayed
                      transactions. Used to compute
                      bloodraven_backup_verification_replay_lag_seconds.
                    format: date-time
                    type: string
                type: object
              sanityCheck:
                description: |-
                  SanityCheck is populated when spec.sanityCheck is set. Records
                  whether the query ran, its duration, and the scalar result so
                  operators can look at `kubectl describe` and tell what the
                  verification actually asserted.
                properties:
                  durationMs:
                    description: DurationMs is the client-side wall-clock duration
                      of the query.
                    format: int64
                    type: integer
                  error:
                    description: |-
                      Error is the error message from a failed sanity query. Set on
                      SanityCheckFailed or SanityCheckTimeout terminal transitions.
                    type: string
                  ran:
                    description: |-
                      Ran is true when the verification Job actually executed the
                      sanity query. Useful for distinguishing "skipped because upstream
                      phase failed" from "ran but returned 0 rows".
                    type: boolean
                  resultRow:
                    description: |-
                      ResultRow is the scalar result rendered as a string. Empty when
                      the query returned zero rows.
                    type: string
                type: object
              startTime:
                description: StartTime is when the verification entered Provisioning.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
