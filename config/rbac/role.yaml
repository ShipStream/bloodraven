  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shipstream.io
  resources:
  - mysqlbackups
  - mysqlbackupverifications
  - mysqlfailovergroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
