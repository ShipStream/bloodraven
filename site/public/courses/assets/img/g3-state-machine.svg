<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">One probe. Four states. The arrows are not symmetric.</text>

  <rect x="380" y="70" width="200" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">unknown</text>

  <rect x="60" y="240" width="200" height="70" rx="10" fill="#e8f6ee" stroke="#1b7f4e" stroke-width="2"/>
  <text x="160" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">writable</text>
  <text x="160" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#166534">2 polls to enter</text>

  <rect x="380" y="240" width="200" height="70" rx="10" fill="#e8f1fa" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="480" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">read-only</text>
  <text x="480" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1e4e8c">1 poll — believed instantly</text>

  <rect x="700" y="240" width="200" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="800" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#7f1d1d">unreachable</text>
  <text x="800" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#991b1b">3 polls (6 s)</text>

  <line x1="420" y1="126" x2="200" y2="240" stroke="#1b7f4e" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="480" y1="126" x2="480" y2="240" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="540" y1="126" x2="760" y2="240" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#r)"/>

  <rect x="240" y="340" width="480" height="52" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
  <text x="480" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9a3412">Second fault while the first is still down: 90 s, not 6 s</text>
  <text x="480" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c2410c">The whole loop backs off. One outage spends that trade on every other site.</text>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b7f4e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
  </defs>
</svg>
