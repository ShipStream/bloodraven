<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img">
  <rect width="960" height="280" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">Only sealed files ship</text>

  <rect x="30" y="80" width="160" height="80" rx="10" fill="#e8f6ee" stroke="#1b7f4e"/>
  <text x="110" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#14532d">rotate</text>
  <text x="110" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#166534">on the primary</text>

  <rect x="230" y="80" width="180" height="80" rx="10" fill="#e8f1fa" stroke="#2b6cb0"/>
  <text x="320" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">sealed file</text>
  <text x="320" y="136" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1e4e8c">mysql-bin.000042</text>

  <rect x="450" y="80" width="160" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="530" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">sidecar</text>
  <text x="530" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#b45309">watches the dir</text>

  <rect x="650" y="80" width="160" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="730" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">object store</text>
  <text x="730" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6d28d9">S3 or PVC</text>

  <line x1="190" y1="120" x2="230" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="120" x2="450" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="610" y1="120" x2="650" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="230" y="190" width="180" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="320" y="214" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">active file</text>
  <text x="320" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">still being written — never archived</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
  </defs>
</svg>
