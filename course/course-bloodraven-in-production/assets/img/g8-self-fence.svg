<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img">
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1a1d23">The sidecar decides locally. No quorum. No permission.</text>

  <rect x="330" y="56" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#334155"/>
  <text x="480" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1e293b">Already read-only?</text>

  <line x1="480" y1="106" x2="200" y2="160" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="106" x2="760" y2="160" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#64748b">yes — stop</text>
  <text x="620" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#334155">no</text>

  <rect x="70" y="160" width="260" height="56" rx="10" fill="#e8f1fa" stroke="#2b6cb0"/>
  <text x="200" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1e3a5f">Nothing to fence. Return.</text>

  <rect x="610" y="160" width="300" height="56" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="760" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9a3412">Rule 1 — topology mismatch</text>
  <text x="760" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#c2410c">Is someone else the active site?</text>

  <line x1="760" y1="216" x2="520" y2="280" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="760" y1="216" x2="760" y2="280" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#b91c1c">yes → fence</text>
  <text x="774" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#334155">no</text>

  <rect x="610" y="280" width="300" height="56" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="760" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9a3412">Rule 2 — lease expiry</text>
  <text x="760" y="324" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#c2410c">Operator and every peer silent?</text>

  <line x1="760" y1="336" x2="520" y2="400" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="760" y1="336" x2="880" y2="400" stroke="#1b7f4e" stroke-width="1.5"/>

  <rect x="360" y="380" width="280" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="500" y="404" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7f1d1d">super_read_only = ON</text>
  <text x="500" y="424" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#991b1b">only Bloodraven can restore</text>

  <rect x="800" y="380" width="140" height="56" rx="10" fill="#e8f6ee" stroke="#1b7f4e"/>
  <text x="870" y="414" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#14532d">stay writable</text>
</svg>
