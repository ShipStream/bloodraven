apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-backup-store
  namespace: orders
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 500Gi
---
apiVersion: shipstream.io/v1alpha1
kind: MysqlFailoverGroup
metadata:
  name: orders
  namespace: orders
spec:
  backup:
    profiles:
      - name: pvc-local
        storage:
          type: PVC
          pvc:
            claimName: orders-backup-store
            subPath: orders
        retentionPolicy:
          count: 7
          minKeep: 2
    schedules:
      - name: nightly
        profileName: pvc-local
        schedule: "0 6 * * *"
        timeZone: Etc/UTC
        concurrencyPolicy: Forbid
