apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bloodraven-alerts
  namespace: monitoring
spec:
  groups:
    - name: bloodraven
      rules:
        - alert: BloodravenOperatorDown
          expr: up{job=~".*bloodraven.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Bloodraven operator metrics target is down
            runbook_url: https://bloodraven.dev/docs/operations/runbooks#operator-unavailable
        - alert: BloodravenBackupVerificationStale
          expr: time() - bloodraven_backup_verified_timestamp_seconds > 172800
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Bloodraven backup verification is stale
            runbook_url: https://bloodraven.dev/docs/backup-and-restore/backup-verification
        # --- data-at-rest encryption -------------------------------------
        # Only meaningful when spec.encryptionAtRest.enabled=true; the
        # series do not exist otherwise, so these are inert on unencrypted
        # groups.
        - alert: BloodravenKeyringNotSealed
          # A site outside the Sealed phase is running with a writable
          # keyring. Its data is still encrypted, but the operator cannot
          # yet prove the key is durably escrowed. Transient during
          # bootstrap, a clone, or a rotation — hence the 15m window.
          expr: bloodraven_keyring_phase{phase="sealed"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Bloodraven site {{ $labels.site }} is running with a writable keyring
            description: >-
              Site {{ $labels.site }} in failover group {{ $labels.group }} is not
              sealed against an escrowed keyring. Check
              status.encryptionAtRest.sites[].message for what it is waiting on.
            runbook_url: https://bloodraven.dev/docs/operations/runbooks#keyring-not-sealed
        - alert: BloodravenKeyringEscrowFailing
          # Sustained escrow failures mean the site can never be sealed.
          expr: rate(bloodraven_keyring_escrow_pushes_total{outcome="failure"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Bloodraven keyring escrow is failing for site {{ $labels.site }}
            description: >-
              The sidecar cannot get its keyring into escrow, so the operator will not
              seal the site. Check the sidecar's /keyring/status lastError field.
            runbook_url: https://bloodraven.dev/docs/operations/runbooks#keyring-not-sealed
        - alert: BloodravenLicenseUpdatesExpiring
          # Renewal reminder only. The operator does not gate or change
          # behavior when the timestamp is in the past.
          expr: (bloodraven_license_updates_expiry_timestamp_seconds - time()) / 86400 < 30
          for: 1h
          labels:
            severity: info
          annotations:
            summary: Bloodraven license update period for {{ $labels.group }} ends in under 30 days
            description: >-
              The paid update period for failover group {{ $labels.namespace }}/{{ $labels.group }}
              ({{ $labels.organization }}, {{ $labels.edition }}) ends soon. This is a compliance
              reminder, not an outage. The operator keeps running.
            runbook_url: https://bloodraven.dev/docs/licensing
        - alert: BloodravenUnencryptedTablespaces
          # Non-zero means part of the data on the PVC is in the clear.
          # Expected on a group adopted with
          # spec.encryptionAtRest.existingData: LeavePlaintext until the
          # pre-existing tables are rebuilt.
          expr: bloodraven_encryption_unencrypted_tablespaces > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Bloodraven site {{ $labels.site }} still has unencrypted tablespaces
            description: >-
              {{ $value }} user tablespaces on site {{ $labels.site }} report ENCRYPTION='N'.
              MySQL only encrypts data written after default_table_encryption takes effect;
              pre-existing tables need ALTER TABLE ... ENCRYPTION='Y'.
            runbook_url: https://bloodraven.dev/docs/configuration/encryption-at-rest#coverage
        # --- paced rollouts ----------------------------------------------
        # Paced rollout of a pod change that an operator release causes
        # (chart value rollout.pacing). The rules are inert while nothing
        # is being rolled and while pacing is off. The gauges are written
        # by the operator pod that holds the leader lease, hence max().
        - alert: BloodravenRolloutStalled
          # A group's roll started and has not finished: this is the halt.
          # The group keeps the rollout slot and every other group keeps
          # its pods. The operator records the stall at once when an
          # ordered update stops on a pod that is not Ready, otherwise
          # after rollout.stallAfter (30m), and keeps it recorded until
          # the roll completes. for: 10m lets a pod that was only slow to
          # become Ready finish its roll without a page.
          expr: max by (namespace, group) (bloodraven_rollout_group_phase{phase="stalled"}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Paced rollout halted, the roll of {{ $labels.namespace }}/{{ $labels.group }} stalled
            description: >-
              Failover group {{ $labels.namespace }}/{{ $labels.group }} started rolling to the
              operator release's pod template and has not finished. It keeps the rollout
              slot, so no other group is rolled. Read status.rollout.message on the group.
            runbook_url: https://bloodraven.dev/docs/operations/runbooks#paced-rollout-halted
        - alert: BloodravenRolloutPendingTooLong
          # Groups wait for the slot and no group is rolling or stalled:
          # every waiting group is unstable, admitted groups do not start
          # (each is deferred after rollout.startGrace), or the rollout
          # record cannot be stored. In a normal fleet rollout the time
          # with nothing rolling is the soak (1m) plus the seconds an
          # admitted group needs to start, and each roll resets this
          # timer, so 30m does not fire. Raise it if you set rollout.soak
          # or rollout.startGrace to 20m or more.
          expr: |
            max(bloodraven_rollout_groups{phase="pending"}) > 0
            unless max(bloodraven_rollout_groups{phase=~"rolling|stalled"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} failover groups wait for the paced rollout and none is rolling"
            description: >-
              The waiting groups keep their old pods, and spec changes that restart pods
              wait with them. List them with bloodraven_rollout_group_phase{phase="pending"}
              and read status.rollout.reason on each.
            runbook_url: https://bloodraven.dev/docs/operations/runbooks#paced-rollout-not-progressing
        - alert: BloodravenRolloutRecordNotStored
          # The installed MysqlFailoverGroup CRD is older than the
          # operator: the API server drops status.rollout, so no group is
          # rolled. Zero when the CRDs are applied before the operator;
          # for: 5m covers an upgrade that applies them right after it.
          expr: max(bloodraven_rollout_record_not_stored) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The paced rollout record of {{ $value }} failover groups cannot be stored
            description: >-
              The installed MysqlFailoverGroup CRD is older than the operator, so no group
              is rolled to the release's pod template. Apply the CRDs of the running
              operator release.
            runbook_url: https://bloodraven.dev/docs/operations/runbooks#rollout-record-not-stored
