apiVersion: shipstream.io/v1alpha1
kind: MysqlFailoverGroup
metadata:
  name: orders
  namespace: orders
spec:
  image: mysql:9.7
  credentials:
    operatorSecretName: orders-mysql-operator
    appSecretName: orders-mysql-app
  dns:
    hostname: orders.az.example.com
    ttlSeconds: 60
  replication:
    maxLagSeconds: 300
    readOnlyMaxLagSeconds: 30
  serviceTemplate:
    type: ClusterIP
  sites:
    - name: iad
      serverID: 101
      zone: us-east-1a
      taintNodeSelector:
        bloodraven.shipstream.io/failover-group.orders: "true"
        bloodraven.shipstream.io/site.orders: iad
      loadBalancerIP: 10.0.1.1
      storage:
        storageClassName: fast-ssd
        size: 100Gi
    - name: pdx
      serverID: 102
      zone: us-west-2a
      taintNodeSelector:
        bloodraven.shipstream.io/failover-group.orders: "true"
        bloodraven.shipstream.io/site.orders: pdx
      loadBalancerIP: 10.0.2.1
      storage:
        storageClassName: fast-ssd
        size: 100Gi
    - name: reader
      serverID: 103
      role: ReadOnly
      zone: us-east-1b
      mysqlConf:
        innodb_buffer_pool_size: 4G
      serviceTemplate:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      storage:
        storageClassName: fast-ssd
        size: 100Gi
