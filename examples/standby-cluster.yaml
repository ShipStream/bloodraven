# MysqlStandbyCluster — canonical onboarding sample.
#
# This manifest MUST be kubectl-apply-able as-is (after substituting the
# placeholder values marked with <…>). Every field maps to a real
# MysqlStandbyClusterSpec field; fabricated names are rejected by strict
# server-side field validation (the default for kubectl apply/create).
#
# The standby is passive: the controller scans the configured prefix,
# populates status.discovered (the newest dump and the verified binlog archive
# window), and stamps the BucketReadable and SourceConfigKnown conditions. No
# MySQL is started and nothing is written to the bucket. To bring up a group
# in the DR cluster, create a MysqlFailoverGroup with spec.initFromBackup
# pointed at the same prefix (see the multi-cluster DR guide).
apiVersion: shipstream.io/v1alpha1
kind: MysqlStandbyCluster
metadata:
  name: orders-east-from-west
  namespace: orders
spec:
  # ObjectStore is the only transport, and the default.
  transport: ObjectStore
  source:
    # The S3 destination of the source group's backup profile
    # (spec.backup.profiles[].storage.s3 on the source MysqlFailoverGroup).
    s3:
      bucket: <shipstream-backups-bucket>
      # Required: the standby scans <prefix>/<dump>/ and <prefix>/binlogs/.
      prefix: orders/west
      region: us-west-2
      # Secret with AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (read-only).
      credentialsSecret: s3-dr-readonly-creds
    # Required when the source profile has encryption enabled.
    # The Secret must be copied to this namespace from the source cluster.
    # See site/content/docs/5.architecture/3.multi-cluster-dr.md — Passphrase distribution.
    decryption:
      passphraseSecret:
        name: orders-backup-passphrase
  freshness:
    discoveryInterval: 5m          # how often to re-scan the bucket (default 5m, minimum 30s)
