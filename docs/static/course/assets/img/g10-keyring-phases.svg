<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img">
  <rect width="960" height="320" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">A lifecycle, not a flag</text>

  <rect x="20" y="80" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="95" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">Pending</text>
  <text x="95" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">no key yet</text>

  <rect x="210" y="80" width="150" height="70" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="285" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Unsealed</text>
  <text x="285" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c2410c">mid-flight</text>

  <rect x="400" y="80" width="150" height="70" rx="10" fill="#e8f1fa" stroke="#2b6cb0"/>
  <text x="475" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">Escrowed</text>
  <text x="475" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1e4e8c">Secret written</text>

  <rect x="590" y="80" width="150" height="70" rx="10" fill="#e8f6ee" stroke="#1b7f4e" stroke-width="2"/>
  <text x="665" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#14532d">Sealed</text>
  <text x="665" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#166534">steady state</text>
  <text x="665" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1b7f4e">done</text>

  <rect x="790" y="80" width="150" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="865" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">Failed</text>
  <text x="865" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#991b1b">exit, any phase</text>

  <line x1="170" y1="115" x2="210" y2="115" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="115" x2="400" y2="115" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="550" y1="115" x2="590" y2="115" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 665 150 C 665 200 285 200 285 150" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="475" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c2410c">Rotation re-enters Unsealed</text>

  <rect x="210" y="230" width="540" height="56" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="480" y="254" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#9a3412">Never rotate the current primary</text>
  <text x="480" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c2410c">Lose a replica keyring and you re-clone. Lose the primary's and you have lost data.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
  </defs>
</svg>
