<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1a1d23">Promotion worked. The socket did not move.</text>

  <rect x="40" y="60" width="420" height="300" rx="12" fill="#f8fafc" stroke="#d0d5dc"/>
  <text x="250" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#334155">What the operator moved</text>
  <rect x="120" y="120" width="200" height="44" rx="22" fill="#f1f5f9" stroke="#334155"/>
  <text x="220" y="147" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#1e293b">-primary selector</text>
  <line x1="220" y1="164" x2="220" y2="220" stroke="#1b7f4e" stroke-width="2" marker-end="url(#g)"/>
  <rect x="110" y="230" width="220" height="80" rx="10" fill="#e8f1fa" stroke="#2b6cb0" stroke-width="2"/>
  <text x="220" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">PDX</text>
  <text x="220" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#2b6cb0">new primary — new connections</text>
  <text x="250" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#64748b">DNS and the Service both say PDX</text>

  <rect x="500" y="60" width="420" height="300" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="710" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#9a3412">What the app still holds</text>
  <rect x="580" y="120" width="200" height="44" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="680" y="147" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4c1d95">pooled TCP socket</text>
  <line x1="680" y1="164" x2="680" y2="220" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>
  <rect x="570" y="230" width="220" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="680" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#7f1d1d">IAD</text>
  <text x="680" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#991b1b">super_read_only = ON</text>
  <text x="680" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#b91c1c">sockets still open</text>

  <text x="250" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#166534">new write → PDX</text>
  <text x="710" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#9a3412">old read succeeds (stale)  ·  old write → ERROR 1290</text>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b7f4e"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
  </defs>
</svg>
