<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img">
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1d23">A write, in four hops</text>

  <rect x="40" y="120" width="160" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="120" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">1  app</text>
  <text x="120" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6d28d9">Increment</text>

  <rect x="260" y="120" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">2  Service</text>
  <text x="360" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#334155">-primary</text>
  <text x="360" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">a name, not a pod</text>

  <rect x="520" y="100" width="200" height="120" rx="10" fill="#e8f6ee" stroke="#1b7f4e" stroke-width="2"/>
  <text x="620" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#14532d">3  IAD pod</text>
  <text x="620" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#166534">role=primary</text>
  <rect x="545" y="170" width="150" height="34" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="620" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400e">sidecar beside it</text>

  <rect x="780" y="120" width="140" height="80" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="850" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">4  disk</text>
  <text x="850" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c2410c">the PVC</text>

  <line x1="200" y1="160" x2="260" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="460" y1="160" x2="520" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="720" y1="160" x2="780" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="480" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#334155">The operator owns the label on hop 3. Flip that label and new connections go somewhere else.</text>
  <text x="480" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">Sockets that are already open do not move. That is Unit 4.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
