                description: 'TerminationGracePeriodSeconds is the grace period for
                  MySQL container shutdown. Default: 60'
                format: int64
                minimum: 1
                type: integer
              tls:
                description: TLS configures TLS for the MySQL instances.
                properties:
                  issuerRef:
                    description: IssuerRef references a cert-manager Issuer or ClusterIssuer.
                    properties:
                      kind:
                        description: Kind of the issuer (Issuer or ClusterIssuer).
                        enum:
                        - Issuer
                        - ClusterIssuer
                        type: string
                      name:
                        description: Name of the issuer.
                        minLength: 1
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  secretName:
                    description: |-
                      SecretName is the name of the Secret containing the TLS certificates.
                      cert-manager should be configured to create this secret from the IssuerRef.
                    minLength: 1
                    type: string
                required:
                - issuerRef
                - secretName
                type: object
              updateStrategy:
                default: OrderedUpdate
                description: 'UpdateStrategy controls how spec changes are rolled
                  out. Default: OrderedUpdate'
                enum:
                - OrderedUpdate
                - Recreate
                type: string
            required:
            - dns
            - secretName
            - sites
            type: object
          status:
            description: MysqlFailoverGroupStatus defines the observed state of MysqlFailoverGroup.
            properties:
              activeSite:
                description: ActiveSite is the name of the site currently acting as
                  primary (writable).
                type: string
              backupSchedules:
                description: |-
                  BackupSchedules is a per-schedule rollup of the most recent backup
                  activity for each entry in spec.backup.schedules.
                items:
                  description: |-
                    BackupScheduleStatus is the per-schedule rollup exposed on
                    MysqlFailoverGroupStatus.
                  properties:
                    cronJobName:
                      description: |-
                        CronJobName is the name of the Kubernetes CronJob that materializes
                        this schedule.
                      type: string
                    lastBackupName:
                      description: |-
                        LastBackupName is the name of the most recent MysqlBackup created
                        by this schedule.
                      type: string
                    lastBackupPhase:
                      description: LastBackupPhase is the phase of that most-recent
                        MysqlBackup.
                      type: string
                    lastRetryAttempt:
                      description: |-
                        LastRetryAttempt is the attempt counter of the latest CR (or the
                        latest retry created off it). 0 or 1 for the original attempt.
                      format: int32
                      type: integer
                    lastScheduleTime:
                      description: |-
                        LastScheduleTime is the most recent time this schedule created a
                        MysqlBackup CR.
                      format: date-time
                      type: string
                    lastSuccessfulBackupName:
                      description: |-
                        LastSuccessfulBackupName is the name of the most recent Succeeded
                        MysqlBackup created by this schedule. Lets dashboards link to the
                        last known-good CR even after a subsequent failure.
                      type: string
                    lastSuccessfulTime:
                      description: |-
                        LastSuccessfulTime is the most recent time a MysqlBackup created by
                        this schedule reached the Succeeded phase.
                      format: date-time
                      type: string
                    name:
                      description: Name of the schedule this entry describes.
                      type: string
                    nextRetryTime:
                      description: |-
                        NextRetryTime, when set, is the earliest time the operator will
                        create a retry CR for a Failed latest attempt. Used by the
                        scheduler loop to wake up at exactly the right moment.
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastBackupTime:
                description: |-
                  LastBackupTime is the completion time of the most recent successful
                  MysqlBackup across all profiles, regardless of whether it was
                  scheduled or on-demand.
                format: date-time
                type: string
              lastFailover:
                description: LastFailover is the timestamp of the last failover event.
                format: date-time
                type: string
              lastFailoverTarget:
                description: LastFailoverTarget is the site that was last promoted
                  during failover.
                type: string
              restore:
                description: Restore tracks an in-flight or completed initFromBackup
                  operation.
                properties:
                  completionTime:
                    description: CompletionTime is when the restore Job reached a
                      terminal state.
                    format: date-time
                    type: string
                  jobName:
                    description: JobName is the name of the batchv1.Job performing
                      the restore.
                    type: string
                  message:
                    description: Message is a human-readable status message.
                    type: string
                  phase:
                    description: Phase of the restore Job.
                    enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                    type: string
                  startTime:
                    description: StartTime is when the restore Job was created.
                    format: date-time
                    type: string
                  targetSite:
                    description: TargetSite is the site name whose MySQL instance
                      is being populated.
                    type: string
                type: object
              sites:
                description: Sites is the observed state of each site, parallel to
                  spec.sites.
                items:
                  description: SiteStatus describes the observed state of a single
                    site.
                  properties:
                    gtidExecuted:
                      description: GtidExecuted is the GTID executed set (populated
                        when replication status is enriched).
                      type: string
                    lastSeen:
                      description: LastSeen is the last time this site was successfully
                        polled.
                      format: date-time
                      type: string
                    name:
                      description: Name is the site identifier, mirrored from spec
                        for convenience.
                      type: string
                    replicating:
                      description: Replicating indicates whether replication is running
                        (populated when replication status is enriched).
                      type: boolean
                    secondsBehindSource:
                      description: SecondsBehindSource is the replication lag in seconds
                        (populated when replication status is enriched).
                      format: int64
                      type: integer
                    state:
                      description: 'State is the current state: writable, read-only,
                        unreachable, or unknown.'
                      enum:
                      - writable
                      - read-only
                      - unreachable
                      - unknown
                      type: string
                  type: object
                type: array
              updatePhase:
                description: UpdatePhase indicates the current phase of an ordered
                  update, empty if not updating.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
