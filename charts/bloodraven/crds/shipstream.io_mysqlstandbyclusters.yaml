---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mysqlstandbyclusters.shipstream.io
spec:
  group: shipstream.io
  names:
    categories:
    - bloodraven
    - mysql
    - dr
    kind: MysqlStandbyCluster
    listKind: MysqlStandbyClusterList
    plural: mysqlstandbyclusters
    shortNames:
    - msc
    - mscs
    singular: mysqlstandbycluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.discovered.dumpLocation
      name: Bucket
      type: string
    - jsonPath: .status.conditions[?(@.type=="BucketReadable")].status
      name: BucketReadable
      type: string
    - jsonPath: .status.conditions[?(@.type=="SourceConfigKnown")].status
      name: SourceKnown
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.activation.phase
      name: Phase
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MysqlStandbyCluster is a passive observability descriptor for a DR
          relationship from this cluster to a source MysqlFailoverGroup's
          backup+PITR archive in a shared object store. The controller scans
          the source bucket on spec.freshness.discoveryInterval and publishes
          two conditions — BucketReadable and SourceConfigKnown — along with
          status.discovered (dump name, location, GTID set, binlog window).
          No MySQL contact, no restore jobs, no activation in Phase 1.

          Future phases (not yet implemented):
          Phase 2 adds continuous restore verification: a scheduled
          MysqlBackupVerification proves the latest dump+PITR window is
          restorable and gates a Restorable condition.
          Phase 3 adds one-command activation: a future admin-confirmed activate
          request materialises a new MysqlFailoverGroup in this namespace loaded
          from the source archive. The spec fields that drive Phase 2/3 are not
          part of v1alpha1 yet; they will be added (backward-compatibly) when
          that code lands.

          One MysqlStandbyCluster per DR relationship per namespace. Designed
          to be symmetric: failback uses a second MysqlStandbyCluster on the
          original-source cluster pointing at the new primary's prefix.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MysqlStandbyClusterSpec defines the desired state of MysqlStandbyCluster.
            properties:
              freshness:
                description: |-
                  Freshness configures the Phase 1 bucket-discovery cadence via
                  discoveryInterval. The Phase 2 verification cadence and staleness
                  knobs are not part of v1alpha1 yet; they will be added
                  (backward-compatibly) when that code lands.
                properties:
                  discoveryInterval:
                    default: 5m
                    description: |-
                      DiscoveryInterval controls how often the controller re-scans
                      the source bucket to refresh status.discovered.
                      Default: 5m. Minimum: 30s (shorter intervals produce no scheduled
                      poll; the reconciler also enforces this floor as defense-in-depth).
                    type: string
                    x-kubernetes-validations:
                    - message: discoveryInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                type: object
              source:
                description: |-
                  Source identifies the source MysqlFailoverGroup whose archive
                  this standby consumes. Cluster + Namespace are informational
                  (used in events + status); only the storage backend is load-bearing.
                properties:
                  cluster:
                    description: |-
                      Cluster is a free-form identifier for the source Kubernetes
                      cluster (e.g. "iad-prod"). Informational. Recommended convention
                      is the kubeconfig context name.
                    type: string
                  decryption:
                    description: |-
                      Decryption, when set, provides the passphrase needed to decrypt
                      the source archive. Required when the source profile had
                      encryption enabled. Reuses BackupDecryptionSpec
                      (api/v1alpha1/backup_types.go:343-349). The Secret it references
                      must exist in this (DR) cluster's namespace — see
                      docs/docs/multi-cluster-dr.mdx for the cross-cluster passphrase
                      distribution runbook.
                    properties:
                      passphraseSecret:
                        description: |-
                          PassphraseSecret references the Secret holding the passphrase
                          that was used when the source artifact was originally encrypted.
                          Bumping the Secret contents to a new value does not rotate the
                          ciphertext — it will simply fail to decrypt.
                        properties:
                          key:
                            default: passphrase
                            description: |-
                              Key within the Secret that holds the passphrase bytes. Leading
                              and trailing whitespace is stripped when the passphrase is
                              read.
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - passphraseSecret
                    type: object
                  failoverGroupName:
                    description: |-
                      FailoverGroupName is the source MysqlFailoverGroup name.
                      Informational; used in events + status. Required so dashboards
                      can correlate a standby to its source.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the source MysqlFailoverGroup in its own cluster.
                      Informational only; not used to make cross-cluster API calls.
                    type: string
                  profileName:
                    description: |-
                      ProfileName is the source backup profile under which dumps and
                      PITR binlogs are stored. The bucket prefix layout follows
                      <storage.prefix>/<mysqlbackup-name>/ for dumps and
                      <storage.prefix>/binlogs/ for the PITR archive
                      (docs/docs/backup-restore.mdx:570-577).
                    minLength: 1
                    type: string
                  storage:
                    description: |-
                      Storage is the object-store backend the source operator writes
                      to. Reuses BackupStorage (api/v1alpha1/backup_types.go:388-444)
                      for consistency; the controller refuses to write to it
                      (except the dr-cursors/ subkey in Phase 2).
                      Only S3-compatible storage is usable: the standby reconciler
                      rejects PVC-backed sources with a ConfigError because the operator
                      pod does not mount the source cluster's backup PVC (see buildStoreCfg
                      in internal/controller/standbycluster_reconciler.go).
                    properties:
                      pvc:
                        description: PVC configures a local PVC destination.
                        properties:
                          claimName:
                            description: |-
                              ClaimName is the name of a pre-existing PVC to use. If empty the
                              operator provisions a PVC per profile.
                            type: string
                          size:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Size is used when the operator provisions
                              the PVC.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          storageClassName:
                            description: StorageClassName is used when the operator
                              provisions the PVC.
                            type: string
                          subPath:
                            description: |-
                              SubPath inside the PVC to use. Each backup lands under
                              "<subPath>/<mysqlbackup-name>/".
                            type: string
                        type: object
                      s3:
                        description: S3 configures an S3-compatible object store destination.
                        properties:
                          bucket:
                            description: Bucket is the S3 bucket name.
                            minLength: 1
                            type: string
                          credentialsSecret:
                            description: |-
                              CredentialsSecret references a Secret whose keys provide AWS
                              credentials to backup and restore Jobs. Expected keys:
                                AWS_ACCESS_KEY_ID (required)
                                AWS_SECRET_ACCESS_KEY (required)
                                AWS_SESSION_TOKEN (optional)
                                AWS_REGION (optional, overrides .region)
                            minLength: 1
                            type: string
                          endpointURL:
                            description: |-
                              EndpointURL overrides the S3 endpoint (e.g. MinIO, Ceph, Wasabi).
                              Passed to mysqlsh as s3EndpointOverride.
                            type: string
                          prefix:
                            description: |-
                              Prefix is the object-name prefix inside the bucket. Each backup
                              lands under "<prefix>/<mysqlbackup-name>/".
                            type: string
                          region:
                            description: Region is the AWS region. Optional for non-AWS
                              S3 stores.
                            type: string
                          storageClass:
                            description: |-
                              StorageClass is the S3 storage class (e.g. STANDARD_IA,
                              DEEP_ARCHIVE). Informational; not enforced by the operator.
                            type: string
                        required:
                        - bucket
                        - credentialsSecret
                        type: object
                      type:
                        description: Type is the storage backend discriminator.
                        enum:
                        - S3
                        - PVC
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of s3 or pvc must be set and must match
                        type
                      rule: (self.type == 'S3' && has(self.s3) && !has(self.pvc))
                        || (self.type == 'PVC' && has(self.pvc) && !has(self.s3))
                required:
                - failoverGroupName
                - profileName
                - storage
                type: object
              template:
                description: |-
                  Template is the MysqlFailoverGroupSpec that the controller
                  materialises into a new MysqlFailoverGroup on Activate (Phase 3).
                  Required so the user declares the full activated shape at
                  standby-CR-creation time, not during an incident.
                properties:
                  name:
                    description: |-
                      Name is the name of the MysqlFailoverGroup to create on
                      activate. Must be unique in this namespace and must not collide
                      with an existing MysqlFailoverGroup unless its ownerReferences
                      point back at this standby CR.
                    minLength: 1
                    type: string
                  spec:
                    description: |-
                      Spec is the embedded MysqlFailoverGroupSpec. Validated at
                      standby-CR-create-time but not actuated until activation (Phase 3).
                    properties:
                      backup:
                        description: |-
                          Backup configures scheduled and on-demand backups for this failover
                          group. Omit the field to disable backups entirely.
                        properties:
                          activeDeadlineSeconds:
                            default: 7200
                            description: |-
                              ActiveDeadlineSeconds caps the wall-clock duration of a single
                              backup Job. Default: 7200 (2h).
                            format: int64
                            minimum: 60
                            type: integer
                          backoffLimit:
                            default: 2
                            description: BackoffLimit is the Job backoffLimit applied
                              to backup Jobs.
                            format: int32
                            minimum: 0
                            type: integer
                          containerSecurityContext:
                            description: |-
                              ContainerSecurityContext overrides the default container-level
                              security context. Same merge semantics as PodSecurityContext:
                              hardened defaults (ReadOnlyRootFilesystem, AllowPrivilegeEscalation
                              false, capability drop ALL) are applied first and user fields take
                              precedence.
                            properties:
                              allowPrivilegeEscalation:
                                description: |-
                                  AllowPrivilegeEscalation controls whether a process can gain more
                                  privileges than its parent process. This bool directly controls if
                                  the no_new_privs flag will be set on the container process.
                                  AllowPrivilegeEscalation is true always when the container is:
                                  1) run as Privileged
                                  2) has CAP_SYS_ADMIN
                                  Note that this field cannot be set when spec.os.name is windows.
                                type: boolean
                              appArmorProfile:
                                description: |-
                                  appArmorProfile is the AppArmor options to use by this container. If set, this profile
                                  overrides the pod's appArmorProfile.
                                  Note that this field cannot be set when spec.os.name is windows.
                                properties:
                                  localhostProfile:
                                    description: |-
                                      localhostProfile indicates a profile loaded on the node that should be used.
                                      The profile must be preconfigured on the node to work.
                                      Must match the loaded name of the profile.
                                      Must be set if and only if type is "Localhost".
                                    type: string
                                  type:
                                    description: |-
                                      type indicates which kind of AppArmor profile will be applied.
                                      Valid options are:
                                        Localhost - a profile pre-loaded on the node.
                                        RuntimeDefault - the container runtime's default profile.
                                        Unconfined - no AppArmor enforcement.
                                    type: string
                                required:
                                - type
                                type: object
                              capabilities:
                                description: |-
                                  The capabilities to add/drop when running containers.
                                  Defaults to the default set of capabilities granted by the container runtime.
                                  Note that this field cannot be set when spec.os.name is windows.
                                properties:
                                  add:
                                    description: Added capabilities
                                    items:
                                      description: Capability represent POSIX capabilities
                                        type
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                  drop:
                                    description: Removed capabilities
                                    items:
                                      description: Capability represent POSIX capabilities
                                        type
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                type: object
                              privileged:
                                description: |-
                                  Run container in privileged mode.
                                  Processes in privileged containers are essentially equivalent to root on the host.
                                  Defaults to false.
                                  Note that this field cannot be set when spec.os.name is windows.
                                type: boolean
                              procMount:
                                description: |-
                                  procMount denotes the type of proc mount to use for the containers.
                                  The default value is Default which uses the container runtime defaults for
                                  readonly paths and masked paths.
                                  Note that this field cannot be set when spec.os.name is windows.
                                type: string
                              readOnlyRootFilesystem:
                                description: |-
                                  Whether this container has a read-only root filesystem.
                                  Default is false.
                                  Note that this field cannot be set when spec.os.name is windows.
                                type: boolean
                              runAsGroup:
                                description: |-
                                  The GID to run the entrypoint of the container process.
                                  Uses runtime default if unset.
                                  May also be set in PodSecurityContext.  If set in both SecurityContext and
                                  PodSecurityContext, the value specified in SecurityContext takes precedence.
                                  Note that this field cannot be set when spec.os.name is windows.
                                format: int64
                                type: integer
                              runAsNonRoot:
                                description: |-
                                  Indicates that the container must run as a non-root user.
                                  If true, the Kubelet will validate the image at runtime to ensure that it
                                  does not run as UID 0 (root) and fail to start the container if it does.
                                  If unset or false, no such validation will be performed.
                                  May also be set in PodSecurityContext.  If set in both SecurityContext and
                                  PodSecurityContext, the value specified in SecurityContext takes precedence.
                                type: boolean
                              runAsUser:
                                description: |-
                                  The UID to run the entrypoint of the container process.
                                  Defaults to user specified in image metadata if unspecified.
                                  May also be set in PodSecurityContext.  If set in both SecurityContext and
                                  PodSecurityContext, the value specified in SecurityContext takes precedence.
                                  Note that this field cannot be set when spec.os.name is windows.
                                format: int64
                                type: integer
                              seLinuxOptions:
                                description: |-
                                  The SELinux context to be applied to the container.
                                  If unspecified, the container runtime will allocate a random SELinux context for each
                                  container.  May also be set in PodSecurityContext.  If set in both SecurityContext and
                                  PodSecurityContext, the value specified in SecurityContext takes precedence.
                                  Note that this field cannot be set when spec.os.name is windows.
                                properties:
                                  level:
                                    description: Level is SELinux level label that
                                      applies to the container.
                                    type: string
                                  role:
                                    description: Role is a SELinux role label that
                                      applies to the container.
                                    type: string
                                  type:
                                    description: Type is a SELinux type label that
                                      applies to the container.
                                    type: string
                                  user:
                                    description: User is a SELinux user label that
                                      applies to the container.
                                    type: string
                                type: object
                              seccompProfile:
                                description: |-
                                  The seccomp options to use by this container. If seccomp options are
                                  provided at both the pod & container level, the container options
                                  override the pod options.
                                  Note that this field cannot be set when spec.os.name is windows.
                                properties:
                                  localhostProfile:
                                    description: |-
                                      localhostProfile indicates a profile defined in a file on the node should be used.
                                      The profile must be preconfigured on the node to work.
                                      Must be a descending path, relative to the kubelet's configured seccomp profile location.
                                      Must be set if type is "Localhost". Must NOT be set for any other type.
                                    type: string
                                  type:
                                    description: |-
                                      type indicates which kind of seccomp profile will be applied.
                                      Valid options are:

                                      Localhost - a profile defined in a file on the node should be used.
                                      RuntimeDefault - the container runtime default profile should be used.
                                      Unconfined - no profile should be applied.
                                    type: string
                                required:
                                - type
                                type: object
                              windowsOptions:
                                description: |-
                                  The Windows specific settings applied to all containers.
                                  If unspecified, the options from the PodSecurityContext will be used.
                                  If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                                  Note that this field cannot be set when spec.os.name is linux.
                                properties:
                                  gmsaCredentialSpec:
                                    description: |-
                                      GMSACredentialSpec is where the GMSA admission webhook
                                      (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                                      GMSA credential spec named by the GMSACredentialSpecName field.
                                    type: string
                                  gmsaCredentialSpecName:
                                    description: GMSACredentialSpecName is the name
                                      of the GMSA credential spec to use.
                                    type: string
                                  hostProcess:
                                    description: |-
                                      HostProcess determines if a container should be run as a 'Host Process' container.
                                      All of a Pod's containers must have the same effective HostProcess value
                                      (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                                      In addition, if HostProcess is true then HostNetwork must also be set to true.
                                    type: boolean
                                  runAsUserName:
                                    description: |-
                                      The UserName in Windows to run the entrypoint of the container process.
                                      Defaults to the user specified in image metadata if unspecified.
                                      May also be set in PodSecurityContext. If set in both SecurityContext and
                                      PodSecurityContext, the value specified in SecurityContext takes precedence.
                                    type: string
                                type: object
                            type: object
                          image:
                            default: container-registry.oracle.com/mysql/community-server:9.7
                            description: |-
                              Image is the container image containing mysqlsh. It must include
                              util.dumpInstance() and util.loadDump() with native S3 support
                              (mysqlsh 8.0.32+). Defaults to DefaultBackupImage; production
                              deployments should always pin a full major.minor tag here and
                              avoid floating tags.
                            type: string
                          imagePullSecrets:
                            description: ImagePullSecrets for the backup image.
                            items:
                              description: |-
                                LocalObjectReference contains enough information to let you locate the
                                referenced object inside the same namespace.
                              properties:
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                            type: array
                          maxLagSecondsForSource:
                            default: 300
                            description: |-
                              MaxLagSecondsForSource is the threshold for replica-first source
                              selection. The backup reconciler prefers the replica site as the
                              dump source, but only if secondsBehindSource is at or below this
                              value. Above it, the reconciler falls back to the primary.
                            format: int64
                            minimum: 0
                            type: integer
                          pitr:
                            description: |-
                              PITR configures point-in-time recovery via continuous binary-log
                              archival. When enabled, the per-pod sidecar watches the local
                              binlog index and uploads each sealed binlog file to the storage
                              backend of the referenced profile. Restore jobs can then replay
                              archived binlogs up to a target timestamp on top of a full dump.
                              Omit the field to disable PITR entirely.
                            properties:
                              archivePollInterval:
                                default: 60s
                                description: |-
                                  ArchivePollInterval is how often the archiver reconciles the list
                                  of binlog files against storage as a belt-and-suspenders safety
                                  net alongside inotify. Default: 60s.
                                type: string
                              enabled:
                                default: false
                                description: |-
                                  Enabled turns binlog archival on or off. Omitting spec.backup.pitr
                                  entirely is equivalent to Enabled=false.
                                type: boolean
                              maxBinlogSize:
                                default: 100M
                                description: |-
                                  MaxBinlogSize is forwarded as the MySQL max_binlog_size variable,
                                  controlling how frequently binlogs rotate. Smaller values reduce
                                  the RPO gap (the tail of transactions on a crashed primary that
                                  may not yet have been archived) at the cost of more objects in
                                  storage. Accepts any value MySQL accepts (e.g. "100M", "256M",
                                  "1073741824"). Defaults to "100M" when PITR is enabled.
                                type: string
                              profileName:
                                description: |-
                                  ProfileName selects the BackupProfile whose storage backend will
                                  hold the archived binlog files. Binlog objects land under a
                                  dedicated "binlogs/" subprefix (or subpath) inside the profile
                                  location so they do not collide with full dumps. Required when
                                  Enabled=true.
                                minLength: 1
                                type: string
                            type: object
                          podSecurityContext:
                            description: |-
                              PodSecurityContext overrides the default pod-level security context
                              used for backup, restore, and cleanup Jobs. User fields are merged
                              on top of the hardened defaults (RunAsNonRoot, RuntimeDefault
                              seccomp, etc.) — leave fields unset to keep the default.
                            properties:
                              appArmorProfile:
                                description: |-
                                  appArmorProfile is the AppArmor options to use by the containers in this pod.
                                  Note that this field cannot be set when spec.os.name is windows.
                                properties:
                                  localhostProfile:
                                    description: |-
                                      localhostProfile indicates a profile loaded on the node that should be used.
                                      The profile must be preconfigured on the node to work.
                                      Must match the loaded name of the profile.
                                      Must be set if and only if type is "Localhost".
                                    type: string
                                  type:
                                    description: |-
                                      type indicates which kind of AppArmor profile will be applied.
                                      Valid options are:
                                        Localhost - a profile pre-loaded on the node.
                                        RuntimeDefault - the container runtime's default profile.
                                        Unconfined - no AppArmor enforcement.
                                    type: string
                                required:
                                - type
                                type: object
                              fsGroup:
                                description: |-
                                  A special supplemental group that applies to all containers in a pod.
                                  Some volume types allow the Kubelet to change the ownership of that volume
                                  to be owned by the pod:

                                  1. The owning GID will be the FSGroup
                                  2. The setgid bit is set (new files created in the volume will be owned by FSGroup)
                                  3. The permission bits are OR'd with rw-rw----

                                  If unset, the Kubelet will not modify the ownership and permissions of any volume.
                                  Note that this field cannot be set when spec.os.name is windows.
                                format: int64
                                type: integer
                              fsGroupChangePolicy:
                                description: |-
                                  fsGroupChangePolicy defines behavior of changing ownership and permission of the volume
                                  before being exposed inside Pod. This field will only apply to
                                  volume types which support fsGroup based ownership(and permissions).
                                  It will have no effect on ephemeral volume types such as: secret, configmaps
                                  and emptydir.
                                  Valid values are "OnRootMismatch" and "Always". If not specified, "Always" is used.
                                  Note that this field cannot be set when spec.os.name is windows.
                                type: string
                              runAsGroup:
                                description: |-
                                  The GID to run the entrypoint of the container process.
                                  Uses runtime default if unset.
                                  May also be set in SecurityContext.  If set in both SecurityContext and
                                  PodSecurityContext, the value specified in SecurityContext takes precedence
                                  for that container.
                                  Note that this field cannot be set when spec.os.name is windows.
                                format: int64
                                type: integer
                              runAsNonRoot:
                                description: |-
                                  Indicates that the container must run as a non-root user.
                                  If true, the Kubelet will validate the image at runtime to ensure that it
                                  does not run as UID 0 (root) and fail to start the container if it does.
                                  If unset or false, no such validation will be performed.
                                  May also be set in SecurityContext.  If set in both SecurityContext and
                                  PodSecurityContext, the value specified in SecurityContext takes precedence.
                                type: boolean
                              runAsUser:
                                description: |-
                                  The UID to run the entrypoint of the container process.
                                  Defaults to user specified in image metadata if unspecified.
                                  May also be set in SecurityContext.  If set in both SecurityContext and
                                  PodSecurityContext, the value specified in SecurityContext takes precedence
                                  for that container.
                                  Note that this field cannot be set when spec.os.name is windows.
                                format: int64
                                type: integer
                              seLinuxChangePolicy:
                                description: |-
                                  seLinuxChangePolicy defines how the container's SELinux label is applied to all volumes used by the Pod.
                                  It has no effect on nodes that do not support SELinux or to volumes does not support SELinux.
                                  Valid values are "MountOption" and "Recursive".

                                  "Recursive" means relabeling of all files on all Pod volumes by the container runtime.
                                  This may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node.

                                  "MountOption" mounts all eligible Pod volumes with `-o context` mount option.
                                  This requires all Pods that share the same volume to use the same SELinux label.
                                  It is not possible to share the same volume among privileged and unprivileged Pods.
                                  Eligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes
                                  whose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their
                                  CSIDriver instance. Other volumes are always re-labelled recursively.
                                  "MountOption" value is allowed only when SELinuxMount feature gate is enabled.

