---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mysqlbackups.shipstream.io
spec:
  group: shipstream.io
  names:
    kind: MysqlBackup
    listKind: MysqlBackupList
    plural: mysqlbackups
    singular: mysqlbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.failoverGroupRef.name
      name: Group
      type: string
    - jsonPath: .spec.profileName
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.startTime
      name: Started
      type: date
    - jsonPath: .status.completionTime
      name: Completed
      type: date
    - jsonPath: .status.location
      name: Location
      priority: 1
      type: string
    - jsonPath: .status.size
      name: Size
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MysqlBackup represents a single backup run against a MysqlFailoverGroup.
          It may be created directly by an operator (one-off backup) or indirectly
          by a CronJob materialized from spec.backup.schedules[].
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MysqlBackupSpec defines the desired state of a MysqlBackup.
            properties:
              failoverGroupRef:
                description: |-
                  FailoverGroupRef identifies the MysqlFailoverGroup in the same
                  namespace whose profile should drive this backup.
                properties:
                  name:
                    description: Name of the MysqlFailoverGroup.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              profileName:
                description: |-
                  ProfileName is the name of a spec.backup.profiles[] entry on the
                  referenced failover group.
                minLength: 1
                type: string
              sourceSiteOverride:
                description: |-
                  SourceSiteOverride, if set, forces a specific site to be the dump
                  source. Leave empty to let the reconciler choose (replica-first).
                type: string
              triggeredBy:
                description: |-
                  TriggeredBy is a free-form label recording what created this CR
                  (e.g. "schedule/nightly", "manual", "retry/nightly/attempt-2").
                  Informational only.
                type: string
            required:
            - failoverGroupRef
            - profileName
            type: object
          status:
            description: MysqlBackupStatus tracks the observed state of a MysqlBackup.
            properties:
              activeSiteAtStart:
                description: |-
                  ActiveSiteAtStart records MysqlFailoverGroup.status.activeSite as
                  observed when this backup's Job was created. The reconciler uses
                  this to emit an InFlightFailover warning when the group's active
                  site drifts while the backup is running.
                type: string
              attempt:
                description: |-
                  Attempt is the retry attempt number for scheduled CRs: 1 for the
                  original attempt, 2 for the first retry, and so on. 0 is treated
                  as 1 for older CRs.
                format: int32
                type: integer
              binlogFile:
                description: |-
                  BinlogFile is the binary log file name at dump time. Populated
                  alongside BinlogPos for pre-GTID point-in-time tooling.
                type: string
              binlogPos:
                description: BinlogPos is the binary log position at dump time.
                format: int64
                type: integer
              completionTime:
                description: CompletionTime is when the backup Job reached a terminal
                  state.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations of this
                  backup's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              encrypted:
                description: |-
                  Encrypted records whether the artifact at Location was encrypted
                  at rest by the operator. True when the driving profile had
                  spec.backup.profiles[].encryption set at the time the backup was
                  taken. The restore side uses this flag to decide whether to run
                  the decrypt init container; it is also useful as a compliance-
                  audit trail for "prove every production backup was encrypted".
                type: boolean
              encryptionAlgorithm:
                description: |-
                  EncryptionAlgorithm is the algorithm identifier stamped onto the
                  artifact header (e.g. "AES-256-GCM"). Empty on unencrypted
                  artifacts. Forward-compat field — a future release that adds a
                  second algorithm can dispatch on this rather than re-reading the
                  header from storage.
                type: string
              gtidExecuted:
                description: |-
                  GtidExecuted is the value of @@global.gtid_executed captured at
                  dump time. Empty on non-GTID instances.
                type: string
              jobName:
                description: JobName is the name of the batchv1.Job running the dump.
                type: string
              location:
                description: |-
                  Location is the resolved URL/path of the backup artifact, e.g.
                  "s3://bucket/prefix/backup-name/" or "/backups/subpath/backup-name".
                type: string
              message:
                description: Message is a human-readable status message.
                type: string
              mysqlImage:
                description: |-
                  MysqlImage is the resolved MySQL server image (spec.image, or the
                  controller default) that was in use on the source failover group
                  when this backup was taken. Captured when the backup Job is
                  created and backfilled from the live spec on next reconcile if
                  empty on older CRs. Retained so future verifications can pin the
                  ephemeral mysqld to a version-compatible tag; the Phase-2
                  verification Job currently runs on the backup/restore image
                  (spec.backup.image) and does not yet consume this field.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status was
                  computed against.
                format: int64
                type: integer
              phase:
                description: Phase is the lifecycle phase of this backup run.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              size:
                description: |-
                  Size is the reported backup size as a human-readable string, best
                  effort. Empty when the Job log did not report a size.
                type: string
              sizeBytes:
                description: |-
                  SizeBytes is the structured backup size emitted by the dump
                  sidecar. 0 when unknown (e.g. remote output where the dump
                  utility did not return a total).
                format: int64
                type: integer
              sourceSite:
                description: |-
                  SourceSite is the site name whose MySQL instance was used as the
                  dump source.
                type: string
              startTime:
                description: StartTime is when the backup Job was created.
                format: date-time
                type: string
              storageType:
                description: |-
                  StorageType is the storage backend kind (S3 or PVC) that was used
                  for this backup. Populated at Job creation time so cleanup logic
                  can dispatch on it without resorting to a brittle location
                  heuristic after the referenced profile is gone.
                enum:
                - S3
                - PVC
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
