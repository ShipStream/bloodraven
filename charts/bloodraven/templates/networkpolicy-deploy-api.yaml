{{- if .Values.auxiliary.deployAPI.networkPolicy.enabled }}
{{- if not .Values.auxiliary.deployAPI.enabled }}
{{- fail "auxiliary.deployAPI.networkPolicy.enabled requires auxiliary.deployAPI.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bloodraven.fullname" . }}-deploy-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bloodraven.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bloodraven.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Preserve metrics, kubelet probes, and auxiliary self-fencing/PITR/status.
    # These are pod ports, independent of Service port overrides.
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
    - from:
        # Both selectors must match the same source, not two alternative peers.
        - namespaceSelector:
            matchLabels:
              shipstream.io/mysql-client: "true"
          podSelector:
            matchLabels:
              bloodraven.shipstream.io/deploy-client: "true"
        # Escrow shares this TLS listener; preserve managed sidecar pushes
        # from every group namespace without requiring deployment-client labels.
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql
              app.kubernetes.io/managed-by: bloodraven
      ports:
        - protocol: TCP
          port: {{ .Values.auxiliary.escrowTLS.port }}
    {{- with .Values.auxiliary.deployAPI.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
