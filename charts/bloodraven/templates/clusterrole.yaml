apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bloodraven.fullname" . }}
  labels:
    {{- include "bloodraven.labels" . | nindent 4 }}
rules:
  # Core resources managed by the reconciler
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, patch, update, watch]
  # pods/log is used by the MysqlBackup reconciler to tail the final
  # `BLOODRAVEN_DUMP_COMPLETE` sentinel line printed by the embedded
  # backup_script.py at the end of a successful mysqlsh dumpInstance run,
  # and by the MysqlBackupVerification reconciler to tail the trailing
  # `BLOODRAVEN_VERIFY_REPLAY_COMPLETE` / `BLOODRAVEN_VERIFY_SANITY_COMPLETE`
  # sentinels emitted by verify.sh. Those sentinels carry the resolved
  # location, size, GTID, binlog coordinates, and sanity-query results
  # that get written back to status.
  #
  # Only `get` is granted here (no list/watch) — reconcilers already
  # know the exact pod name from the Job, so no discovery is required,
  # and the scope is intentionally limited so an operator compromise
  # cannot tail arbitrary workload logs.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [create, delete, get, list, patch, update, watch]
  # MysqlFailoverGroup CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups/status]
    verbs: [get, patch, update]
  # MysqlBackup CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups/status]
    verbs: [get, patch, update]
  # MysqlBackupVerification CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlbackupverifications]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackupverifications/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackupverifications/status]
    verbs: [get, patch, update]
  # External DNS (DNSEndpoint updates for DNS failover)
  - apiGroups: [externaldns.k8s.io]
    resources: [dnsendpoints]
    verbs: [create, delete, get, list, patch, update, watch]
  # PodDisruptionBudgets
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
