apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bloodraven.fullname" . }}
  labels:
    {{- include "bloodraven.labels" . | nindent 4 }}
rules:
  # Core resources managed by the reconciler
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [create, delete, get, list, patch, update, watch]
  # MysqlFailoverGroup CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups/status]
    verbs: [get, patch, update]
  # MysqlBackup CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups/status]
    verbs: [get, patch, update]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
