apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bloodraven.fullname" . }}
  labels:
    {{- include "bloodraven.labels" . | nindent 4 }}
rules:
  # Core resources managed by the reconciler
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete, get, list, patch, update, watch]
  # pods/log is used by the MysqlBackup reconciler to tail the final
  # `BLOODRAVEN_DUMP_COMPLETE` sentinel line printed by the embedded
  # backup_script.py at the end of a successful mysqlsh dumpInstance run,
  # and by the MysqlBackupVerification reconciler to tail the trailing
  # `BLOODRAVEN_VERIFY_REPLAY_COMPLETE` / `BLOODRAVEN_VERIFY_SANITY_COMPLETE`
  # sentinels emitted by verify.sh. Those sentinels carry the resolved
  # location, size, GTID, binlog coordinates, and sanity-query results
  # that get written back to status.
  #
  # Reconcilers discover the relevant terminal pod via `pods list` using
  # label selectors (the pods/jobs verbs above already cover that), then
  # fetch logs for the resolved pod via `pods/log get`. Only `get` is
  # granted for `pods/log` (no list/watch), so the log-access scope
  # remains intentionally limited — an operator compromise cannot tail
  # arbitrary workload logs.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [create, delete, get, list, patch, update, watch]
  # MysqlFailoverGroup CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlfailovergroups/status]
    verbs: [get, patch, update]
  # MysqlBackup CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackups/status]
    verbs: [get, patch, update]
  # MysqlBackupVerification CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlbackupverifications]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackupverifications/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlbackupverifications/status]
    verbs: [get, patch, update]
  # MysqlStandbyCluster CRD
  - apiGroups: [shipstream.io]
    resources: [mysqlstandbyclusters]
    verbs: [get, list, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqlstandbyclusters/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqlstandbyclusters/status]
    verbs: [get, patch, update]
  # MysqlDatabase CRD (tenant databases).
  #
  # Deliberately no `create` and no `delete`: the operator reconciles tenant
  # databases that a caller declared, it never invents or removes the CRs
  # themselves. `update` is required to add and remove the
  # shipstream.io/mysqldatabase finalizer. Callers get create/delete through
  # a separate namespaced Role that grants no Secret access and no MySQL
  # credential — see config/rbac/mysqldatabase_caller_role.yaml.
  - apiGroups: [shipstream.io]
    resources: [mysqldatabases]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [shipstream.io]
    resources: [mysqldatabases/finalizers]
    verbs: [update]
  - apiGroups: [shipstream.io]
    resources: [mysqldatabases/status]
    verbs: [get, patch, update]
  # External DNS (DNSEndpoint updates for DNS failover)
  - apiGroups: [externaldns.k8s.io]
    resources: [dnsendpoints]
    verbs: [create, delete, get, list, patch, update, watch]
  # PodDisruptionBudgets
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
