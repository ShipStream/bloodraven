{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bloodraven.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bloodraven.labels" . | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "bloodraven.selectorLabels" . | nindent 4 }}
{{- end }}
