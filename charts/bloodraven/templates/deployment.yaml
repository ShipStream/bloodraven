{{- if and .Values.auxiliary.deployAPI.enabled (not .Values.auxiliary.escrowTLS.enabled) }}
{{- fail "auxiliary.deployAPI.enabled requires auxiliary.escrowTLS.enabled=true" }}
{{- end }}
{{- if and .Values.auxiliary.deployAPI.enabled (not .Values.leaderElection.enabled) }}
{{- fail "auxiliary.deployAPI.enabled requires leaderElection.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bloodraven.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bloodraven.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.leaderElection.enabled }}
    # The new pod checks the installed CRDs before it starts its manager,
    # and its readiness endpoint is served by that manager. A pod that
    # refuses to start (CRDs older than it needs: a chart-only upgrade)
    # therefore never becomes Ready, and with maxUnavailable 0 the previous
    # operator keeps running and keeps the lease. Leader election keeps the
    # two pods of a successful upgrade from acting together.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # Without leader election two pods would both act, so the previous pod
    # must be gone before the new one starts.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "bloodraven.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bloodraven.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bloodraven.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: operator
          image: {{ include "bloodraven.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect=true
            {{- else }}
            - --leader-elect=false
            {{- end }}
            # A missing key is what `helm upgrade --reuse-values` from a
            # release before v1.8.0 renders with.
            - --crd-check={{ .Values.crdCheck | default "enforce" }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: auxiliary
              containerPort: 8082
              protocol: TCP
            {{- if .Values.auxiliary.escrowTLS.enabled }}
            - name: escrow-tls
              containerPort: {{ .Values.auxiliary.escrowTLS.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # Image used when the controller creates CronJobs for scheduled
            # backups (spec.backup.schedules[]). Kept in sync with the
            # operator's own Deployment so that trigger-backup pods run the
            # same binary.
            - name: BLOODRAVEN_OPERATOR_IMAGE
              value: {{ include "bloodraven.image" . | quote }}
            # Sidecar image for failover groups that leave
            # spec.sidecar.image empty (sidecar.image.repository and
            # sidecar.image.tag).
            - name: BLOODRAVEN_SIDECAR_IMAGE
              value: {{ include "bloodraven.sidecarImage" . | quote }}
            # Paced rollouts of release-driven pod changes (rollout.*).
            # The keys are read through a map that may be missing or
            # partial: `helm upgrade --reuse-values` from a release older
            # than v1.8.0 renders these templates over that release's
            # values, which have no `rollout`. Pacing is then on, and an
            # empty duration takes the operator's default.
            {{- $rollout := .Values.rollout | default dict }}
            - name: BLOODRAVEN_ROLLOUT_PACING
              value: {{ if hasKey $rollout "pacing" }}{{ $rollout.pacing | quote }}{{ else }}"true"{{ end }}
            - name: BLOODRAVEN_ROLLOUT_SOAK
              value: {{ $rollout.soak | default "" | quote }}
            - name: BLOODRAVEN_ROLLOUT_STALL_AFTER
              value: {{ $rollout.stallAfter | default "" | quote }}
            - name: BLOODRAVEN_ROLLOUT_START_GRACE
              value: {{ $rollout.startGrace | default "" | quote }}
            # Default operator auxiliary endpoint injected into MySQL sidecars
            # when spec.sidecar.operatorEndpoint is not set.
            - name: BLOODRAVEN_DEFAULT_OPERATOR_ENDPOINT
              value: {{ printf "%s.%s.svc.cluster.local:%v" (include "bloodraven.auxiliaryServiceName" .) .Release.Namespace (.Values.auxiliary.service.port | int) | quote }}
            {{- if .Values.auxiliary.escrowTLS.enabled }}
            - name: BLOODRAVEN_DEFAULT_ESCROW_URL
              value: {{ printf "https://%s.%s.svc.cluster.local:%v/keyring/escrow" (include "bloodraven.auxiliaryServiceName" .) .Release.Namespace (.Values.auxiliary.escrowTLS.port | int) | quote }}
            - name: BLOODRAVEN_ESCROW_TLS_ADDR
              value: {{ printf ":%v" (.Values.auxiliary.escrowTLS.port | int) | quote }}
            - name: BLOODRAVEN_ESCROW_TLS_CERT_FILE
              value: /etc/bloodraven/escrow-tls/tls.crt
            - name: BLOODRAVEN_ESCROW_TLS_KEY_FILE
              value: /etc/bloodraven/escrow-tls/tls.key
            {{- end }}
            {{- if .Values.auxiliary.deployAPI.enabled }}
            - name: BLOODRAVEN_DEPLOY_API_ENABLED
              value: "true"
            - name: BLOODRAVEN_DEPLOY_API_AUDIENCE
              value: {{ required "auxiliary.deployAPI.audience must not be empty" .Values.auxiliary.deployAPI.audience | quote }}
            {{- end }}
            # WebSocket hardening (AUDIT H2): Origin allowlist + client cap.
            - name: BLOODRAVEN_WS_ALLOWED_ORIGINS
              value: {{ .Values.auxiliary.service.wsAllowedOrigins | default "" | quote }}
            - name: BLOODRAVEN_WS_MAX_CLIENTS
              value: {{ include "bloodraven.wsMaxClients" . | quote }}
            # The install ID of the usage report lives in a ConfigMap in this
            # namespace. A missing telemetry key (`helm upgrade
            # --reuse-values` from a release before it) leaves it on.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- $telemetry := .Values.telemetry | default dict }}
            - name: BLOODRAVEN_TELEMETRY
              value: {{ if hasKey $telemetry "enabled" }}{{ $telemetry.enabled | quote }}{{ else }}"true"{{ end }}
            {{- with $telemetry.endpoint }}
            - name: BLOODRAVEN_TELEMETRY_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.license }}
            - name: BLOODRAVEN_LICENSE
              value: {{ .Values.license | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if not (include "bloodraven.userMountsTmp" .) }}
            # The root filesystem is read-only. The MysqlStandbyCluster
            # reconciler stages a source bucket's credentials and passphrase
            # in a temporary directory for the S3 client; without a writable
            # /tmp no standby cluster can read its bucket.
            - name: bloodraven-tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.auxiliary.escrowTLS.enabled }}
            - name: escrow-tls
              mountPath: /etc/bloodraven/escrow-tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if not (include "bloodraven.userMountsTmp" .) }}
        - name: bloodraven-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- end }}
        {{- if .Values.auxiliary.escrowTLS.enabled }}
        - name: escrow-tls
          secret:
            secretName: {{ required "auxiliary.escrowTLS.existingSecret is required when escrow TLS is enabled" .Values.auxiliary.escrowTLS.existingSecret }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
