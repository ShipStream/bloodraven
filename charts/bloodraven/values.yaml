# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Number of operator replicas (should be 1; leader election provides safety)
replicaCount: 1

image:
  # -- Operator image repository
  repository: ghcr.io/shipstream/bloodraven
  # -- Operator image tag (defaults to .Chart.AppVersion)
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount for the operator
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name (defaults to fullname)
  name: ""

# -- Pod-level annotations
podAnnotations: {}

# -- Pod-level labels (merged with standard labels)
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Node selector for the operator pod
nodeSelector:
  node-role.kubernetes.io/control-plane: ""

# -- Tolerations for the operator pod
tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule

# -- Affinity rules for the operator pod
affinity: {}

# -- Additional environment variables for the operator container
extraEnv: []
# - name: LOG_LEVEL
#   value: "debug"

# -- Additional volume mounts for the operator container
extraVolumeMounts: []

# -- Additional volumes for the operator pod
extraVolumes: []

# Leader election ensures safe single-writer semantics.
leaderElection:
  # -- Enable leader election (strongly recommended)
  enabled: true

metrics:
  service:
    # -- Create a Service for Prometheus metrics scraping
    enabled: true
    # -- Metrics service port
    port: 8080
    # -- Annotations for the metrics service
    annotations: {}

  serviceMonitor:
    # -- Create a Prometheus ServiceMonitor resource
    enabled: false
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s
    # -- Additional labels for the ServiceMonitor (e.g. release: prometheus)
    labels: {}

# Grafana dashboards.
#
# When enabled, the chart renders one ConfigMap per JSON file in
# `charts/bloodraven/dashboards/`. Each ConfigMap carries the
# `grafana_dashboard: "1"` label, which Grafana's dashboard-discovery sidecar
# picks up automatically (this is the default configuration of both the
# kube-prometheus-stack chart and the upstream grafana/grafana chart).
#
# If you run Grafana some other way — provisioning from disk, or importing
# JSON by hand — just copy the files from `charts/bloodraven/dashboards/`
# directly, no Helm needed. See docs/docs/monitoring.mdx for all three paths.
grafanaDashboards:
  # -- Render the dashboard ConfigMaps. Safe to enable even if you don't yet
  # run Grafana — the ConfigMaps sit idle until a sidecar discovers them.
  enabled: false
  # -- Namespace for the ConfigMaps. Defaults to the release namespace.
  # Some setups scope the Grafana sidecar to a single namespace (often
  # `monitoring`); set this accordingly.
  namespace: ""
  # -- Selector label name the Grafana sidecar watches for. Leave as-is unless
  # you changed your sidecar's `LABEL` env var.
  label: grafana_dashboard
  # -- Selector label value. Leave as-is unless you changed the sidecar's
  # `LABEL_VALUE`.
  labelValue: "1"
  # -- Grafana folder the dashboards land in.
  folder: Bloodraven
  # -- Extra labels to stamp on every dashboard ConfigMap.
  extraLabels: {}
  # -- Extra annotations to stamp on every dashboard ConfigMap.
  extraAnnotations: {}

auxiliary:
  service:
    # -- Create a Service for the auxiliary HTTP/WebSocket endpoint.
    # This endpoint exposes /status, /active-site, /pitr-cutoff, and
    # /ws/status. It currently has NO authentication or authorization
    # (see AUDIT H2); anything on the pod network can read failover-group
    # state for arbitrary namespaces and open unbounded WebSockets.
    # Keep disabled unless the sidecar / dashboard / PITR retention
    # sweeper actually need it, and pair with a NetworkPolicy that
    # limits ingress to those specific ServiceAccounts.
    enabled: false
    # -- Auxiliary service port (status API + WebSocket)
    port: 8082
    # -- Service type
    type: ClusterIP
    # -- Annotations for the auxiliary service
    annotations: {}
    # -- Comma-separated allowlist of Origin headers permitted on the
    # /ws/status WebSocket upgrade. Default "*" (wildcard) matches the
    # pre-hardening behavior — a narrower list is strongly recommended
    # for production (e.g. "https://dashboard.example.com").
    wsAllowedOrigins: "*"
    # -- Cap on concurrent WebSocket clients connected to /ws/status.
    # Beyond this limit, additional upgrades are rejected with 429.
    # Defends against an attacker pinning the hub's clients map.
    wsMaxClients: 100

# -- Install CRDs. Set to false if CRDs are managed externally.
installCRDs: true
